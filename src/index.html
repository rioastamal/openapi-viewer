    function renderLiveResponseOutput() {
      const responseContainer = document.getElementById('interactive-response-container');
      const jsonWrap = document.getElementById('try-response-json-wrap');
      const tableWrap = document.getElementById('try-response-table-wrap');
      if (!responseContainer) return;

      const resState = state.tryRequestState;
      if (resState.loading) {
        responseContainer.classList.remove('hidden');
        document.getElementById('try-response-status').textContent = 'Loading...';
        document.getElementById('try-response-status').className = 'px-1.5 py-0.5 rounded font-mono text-[11px] bg-blue-900/60 text-blue-300';
        document.getElementById('try-response-time').textContent = '';
        document.getElementById('try-response-code').innerHTML = highlightCode('// Executing HTTP request...', 'javascript');
        updateLiveResponseViewSwitcher(false);
        if (jsonWrap) jsonWrap.classList.remove('hidden');
        if (tableWrap) tableWrap.classList.add('hidden');
      } else if (resState.statusCode !== null || resState.error !== null) {
        responseContainer.classList.remove('hidden');
        const statusEl = document.getElementById('try-response-status');
        const timeEl = document.getElementById('try-response-time');
        const codeEl = document.getElementById('try-response-code');

        if (resState.error) {
          statusEl.textContent = 'CORS / Network Error';
          statusEl.className = 'px-1.5 py-0.5 rounded font-mono text-[11px] bg-rose-900/60 text-rose-300 border border-rose-800';
          timeEl.textContent = `${resState.timeMs}ms`;
          const errText = `// Direct browser fetch failed due to CORS or network security:\n${resState.error}\n\n// Note: This API endpoint does not allow direct cross-origin browser requests.\n// You can run the generated Node.js / JavaScript snippet safely in backend services or curl.`;
          codeEl.innerHTML = highlightCode(errText, 'javascript');
          updateLiveResponseViewSwitcher(false);
          if (jsonWrap) jsonWrap.classList.remove('hidden');
          if (tableWrap) tableWrap.classList.add('hidden');
        } else {
          statusEl.textContent = `${resState.statusCode} ${resState.statusText}`;
          const isSuccess = resState.statusCode >= 200 && resState.statusCode < 300;
          statusEl.className = `px-1.5 py-0.5 rounded font-mono text-[11px] border ${isSuccess ? 'bg-emerald-900/60 text-emerald-300 border-emerald-800' : 'bg-amber-900/60 text-amber-300 border-amber-800'}`;
          timeEl.textContent = `${resState.timeMs}ms`;
          const bodyStr = typeof resState.body === 'object' ? JSON.stringify(resState.body, null, 2) : String(resState.body);
          codeEl.innerHTML = highlightCode(bodyStr, 'json');

          const isTableSupported = resState.body !== null && typeof resState.body === 'object';
          updateLiveResponseViewSwitcher(isTableSupported);

          if (isTableSupported && state.liveResponseView === 'table') {
            if (jsonWrap) jsonWrap.classList.add('hidden');
            if (tableWrap) tableWrap.classList.remove('hidden');
            renderLiveResponseTable(getActiveTableBody());
          } else {
            if (jsonWrap) jsonWrap.classList.remove('hidden');
            if (tableWrap) tableWrap.classList.add('hidden');
          }
        }
      } else {
        responseContainer.classList.add('hidden');
      }

      updateFullscreenUI();
      lucide.createIcons();
    }

    /**
     * ============================================================================
     * 9. INTERACTIVE CLIENT FETCH INVOCATION
     * ============================================================================
     */
    async function executeLiveRequest() {
      const endpoint = getSelectedEndpoint();
      if (!endpoint || !state.parsedSpec) return;

      state.liveResponseFilter = '';
      state.liveResponseSortCol = null;
      state.liveResponseSortDir = null;
      state.liveResponseTableStack = [];
      state.tryRequestState = {
        loading: true,
        statusCode: null,
        statusText: null,
        timeMs: null,
        body: null,
        error: null
      };
      renderInteractiveClient();

      const varsMap = getResolvedVariablesMap();

      // Build live URL
      let pathExpr = endpoint.path;
      const pathParams = endpoint.parameters.filter(p => p.in === 'path');
      for (const p of pathParams) {
        let rawVal = state.liveParamValues[p.name] !== undefined ? state.liveParamValues[p.name] : '42';
        const val = substituteVariables(rawVal, varsMap);
        pathExpr = pathExpr.replace(`{${p.name}}`, encodeURIComponent(val));
      }

      const activeBaseRaw = (state.liveServerUrl !== null && state.liveServerUrl.trim() !== '')
        ? state.liveServerUrl.trim()
        : (state.parsedSpec.baseUrl || 'https://api.example.com');
      const activeBase = substituteVariables(activeBaseRaw, varsMap);
      const cleanBase = activeBase.replace(/\/$/, '');
      const url = new URL(`${cleanBase}${pathExpr}`);

      // Query params
      const queryParams = endpoint.parameters.filter(p => p.in === 'query');
      for (const q of queryParams) {
        if (state.liveParamValues[q.name] !== undefined) {
          const qVal = substituteVariables(state.liveParamValues[q.name], varsMap);
          url.searchParams.append(q.name, qVal);
        }
      }

      // Headers
      const headers = { 'Accept': 'application/json' };
      if (endpoint.requestBody) {
        headers['Content-Type'] = endpoint.requestBody.contentType || 'application/json';
      }
      if (varsMap['API_TOKEN']) {
        headers['Authorization'] = `Bearer ${varsMap['API_TOKEN']}`;
      }
      const headerParams = endpoint.parameters.filter(p => p.in === 'header');
      for (const h of headerParams) {
        if (state.liveParamValues[h.name]) {
          const hVal = substituteVariables(state.liveParamValues[h.name], varsMap);
          headers[h.name] = hVal;
        }
      }

      const startTime = performance.now();

      try {
        const options = {
          method: endpoint.method,
          headers
        };

        if (endpoint.requestBody && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(endpoint.method)) {
          options.body = substituteVariables(state.liveBodyText || '{}', varsMap);
        }

        const res = await fetch(url.toString(), options);
        const elapsed = Math.round(performance.now() - startTime);

        let bodyData = null;
        const text = await res.text();
        try {
          bodyData = JSON.parse(text);
        } catch (e) {
          bodyData = text;
        }

        state.tryRequestState = {
          loading: false,
          statusCode: res.status,
          statusText: res.statusText,
          timeMs: elapsed,
          body: bodyData,
          error: null
        };
      } catch (err) {
        const elapsed = Math.round(performance.now() - startTime);
        state.tryRequestState = {
          loading: false,
          statusCode: null,
          statusText: null,
          timeMs: elapsed,
          body: null,
          error: err.message
        };
      }

      renderInteractiveClient();
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-xl shadow-lg border text-xs font-medium transform transition-all duration-300 translate-y-2 opacity-0';

      if (type === 'success') {
        toast.className += ' bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-slate-800 dark:border-slate-200';
      } else if (type === 'error') {
        toast.className += ' bg-rose-600 text-white border-rose-700';
      } else {
        toast.className += ' bg-slate-800 text-white border-slate-700';
      }

      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle' : (type === 'error' ? 'alert-triangle' : 'info')}" class="w-4 h-4"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      lucide.createIcons();

      // Animate in
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      // Animate out after 3.5s
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function initEventListeners() {
      // 1. Navigation Clicks (Guides and Endpoints - Event Delegation on nav-endpoints-tree)
      const navTree = document.getElementById('nav-endpoints-tree');
      if (navTree) {
        navTree.addEventListener('click', (e) => {
          const pageItem = e.target.closest('.page-nav-item');
          if (pageItem) {
            const pageId = pageItem.getAttribute('data-page-id');
            if (pageId) selectPage(pageId);
            return;
          }
          const item = e.target.closest('.endpoint-nav-item');
          if (item) {
            const epId = item.getAttribute('data-endpoint-id');
            if (epId) selectEndpoint(epId);
            return;
          }
          if (e.target.id === 'btn-reset-filter') {
            const input = document.getElementById('input-filter');
            if (input) input.value = '';
            setFilterText('');
          }
        });
      }

      // 2. Tag Filter Pills (Event Delegation)
      const tagPills = document.getElementById('tag-filter-pills');
      if (tagPills) {
        tagPills.addEventListener('click', (e) => {
          const btn = e.target.closest('.tag-filter-btn');
          if (btn) {
            const tag = btn.getAttribute('data-tag');
            if (tag) setSelectedTag(tag);
          }
        });
      }

      // 3. Search Filter Input
      const filterInput = document.getElementById('input-filter');
      if (filterInput) {
        filterInput.addEventListener('input', (e) => setFilterText(e.target.value));
      }

      const clearSearchBtn = document.getElementById('btn-clear-search');
      if (clearSearchBtn) {
        clearSearchBtn.addEventListener('click', () => {
          if (filterInput) filterInput.value = '';
          setFilterText('');
          filterInput.focus();
        });
      }

      // __COMPONENT_LOAD_URL_START__
      // 4. Remote Spec Fetch Form
      const fetchForm = document.getElementById('form-fetch-remote');
      if (fetchForm) {
        fetchForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const urlInput = document.getElementById('input-spec-url');
          const url = (urlInput.value || '').trim();
          if (!url) return;

          showToast('Fetching remote OpenAPI specification...', 'info');
          const fetchBtn = document.getElementById('btn-fetch-spec');
          const originalText = fetchBtn.innerHTML;
          fetchBtn.innerHTML = `<span>Loading...</span>`;
          fetchBtn.disabled = true;

          try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
            const text = await res.text();
            const data = parseSpecText(text, url);
            setSpec(data);
          } catch (err) {
            console.error(err);
            showAlert(`Failed to load from ${url}. Reason: ${err.message}. If this is a cross-origin server, make sure CORS is enabled.`);
            showToast('Failed to fetch or parse specification', 'error');
          } finally {
            fetchBtn.innerHTML = originalText;
            fetchBtn.disabled = false;
          }
        });
      }
      // __COMPONENT_LOAD_URL_END__

      // __COMPONENT_UPLOAD_START__
      // 5. Local File Picker
      const fileInput = document.getElementById('spec-file-input');
      if (fileInput) {
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const parsed = parseSpecText(event.target.result, file.name);
              setSpec(parsed);
              fileInput.value = ''; // Reset file input
            } catch (parseErr) {
              showAlert(`Invalid Specification File: ${parseErr.message}`);
              showToast('Invalid JSON/YAML file format', 'error');
              fileInput.value = ''; // Reset file input so user can re-select fixed file
            }
          };
          reader.onerror = () => {
            showAlert('Failed to read file from disk');
            showToast('File read error', 'error');
          };
          reader.readAsText(file);
        });
      }
      // __COMPONENT_UPLOAD_END__


      // 6. Reset Demo Button
      const resetBtn = document.getElementById('btn-reset-demo');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          if (typeof EMBEDDED_OPENAPI_SPEC !== 'undefined' && EMBEDDED_OPENAPI_SPEC) {
            setSpec(EMBEDDED_OPENAPI_SPEC);
            showToast('Specification reloaded', 'success');
          } else {
            showToast('No embedded specification available', 'info');
          }
        });
      }

      // 8. Dark Mode Toggle
      const themeToggleBtn = document.getElementById('btn-theme-toggle');
      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', toggleDarkMode);
      }

      // Toggle Sidebar Buttons (Desktop)
      const toggleSidebarBtn = document.getElementById('btn-toggle-sidebar');
      if (toggleSidebarBtn) {
        toggleSidebarBtn.addEventListener('click', () => toggleSidebar(true));
      }
      const expandSidebarBtn = document.getElementById('btn-expand-sidebar');
      if (expandSidebarBtn) {
        expandSidebarBtn.addEventListener('click', () => toggleSidebar(false));
      }

      // Toggle Code Panel Buttons (Desktop)
      const toggleCodePanelBtn = document.getElementById('btn-toggle-code-panel');
      if (toggleCodePanelBtn) {
        toggleCodePanelBtn.addEventListener('click', () => toggleCodePanel(true));
      }
      const expandCodePanelBtn = document.getElementById('btn-expand-code-panel');
      if (expandCodePanelBtn) {
        expandCodePanelBtn.addEventListener('click', () => toggleCodePanel(false));
      }
      const fullscreenCodePanelBtn = document.getElementById('btn-fullscreen-code-panel');
      if (fullscreenCodePanelBtn) {
        fullscreenCodePanelBtn.addEventListener('click', () => toggleCodePanelFullscreen());
      }

      // 9. Mobile Menu Drawer Toggles
      const openDrawerBtn = document.getElementById('btn-toggle-mobile-menu');
      const closeDrawerBtn = document.getElementById('btn-close-mobile-menu');
      const backdrop = document.getElementById('mobile-drawer-backdrop');

      if (openDrawerBtn) openDrawerBtn.addEventListener('click', () => toggleMobileDrawer(true));
      if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', () => toggleMobileDrawer(false));
      if (backdrop) backdrop.addEventListener('click', () => toggleMobileDrawer(false));

      // 10. Mobile Segmented Tabs
      const mobileTabDocs = document.getElementById('mobile-tab-docs');
      const mobileTabCode = document.getElementById('mobile-tab-code');
      if (mobileTabDocs) mobileTabDocs.addEventListener('click', () => setMobileTab('docs'));
      if (mobileTabCode) mobileTabCode.addEventListener('click', () => setMobileTab('code'));

      // 11. Language Switcher Controls (Mobile Select & Desktop Pills)
      const mobileLangSelect = document.getElementById('select-code-lang-mobile');
      if (mobileLangSelect) {
        mobileLangSelect.addEventListener('change', (e) => {
          setSelectedCodeLang(e.target.value);
        });
      }

      const desktopLangPills = document.getElementById('desktop-lang-pills');
      if (desktopLangPills) {
        desktopLangPills.addEventListener('click', (e) => {
          const btn = e.target.closest('.lang-tab-btn');
          if (btn) {
            const lang = btn.getAttribute('data-lang');
            if (lang) setSelectedCodeLang(lang);
          }
        });
      }

      // 12. Interactive Test Toggle Button
      const toggleTryBtn = document.getElementById('btn-toggle-interactive-test');
      if (toggleTryBtn) {
        toggleTryBtn.addEventListener('click', toggleInteractiveTest);
      }

      // 13. Copy Code Snippet Button
      const copyCodeBtn = document.getElementById('btn-copy-code');
      if (copyCodeBtn) {
        copyCodeBtn.addEventListener('click', async () => {
          const endpoint = getSelectedEndpoint();
          if (!endpoint || !state.parsedSpec) return;

          const lang = state.selectedCodeLang || 'curl';
          const activeBase = (state.liveServerUrl !== null && state.liveServerUrl.trim() !== '')
            ? state.liveServerUrl.trim()
            : state.parsedSpec.baseUrl;
          const code = generateCodeForLang(lang, endpoint, activeBase, state.liveParamValues, state.liveBodyText);
          try {
            await navigator.clipboard.writeText(code);
            const btnText = document.getElementById('copy-btn-text');
            if (btnText) btnText.textContent = 'Copied!';
            copyCodeBtn.classList.add('bg-emerald-700', 'text-white');
            const langLabel = lang === 'curl' ? 'cURL' : (lang === 'javascript' ? 'JavaScript' : (lang === 'golang' ? 'Golang' : 'PHP'));
            showToast(`${langLabel} code copied to clipboard`, 'success');
            setTimeout(() => {
              if (btnText) btnText.textContent = 'Copy';
              copyCodeBtn.classList.remove('bg-emerald-700', 'text-white');
            }, 2000);
          } catch (err) {
            showToast('Failed to copy', 'error');
          }
        });
      }

      // 14. Interactive Client Request Button
      const runRequestBtn = document.getElementById('btn-execute-request');
      if (runRequestBtn) {
        runRequestBtn.addEventListener('click', executeLiveRequest);
      }
      const shortcutHint = document.getElementById('btn-execute-shortcut-hint');
      if (shortcutHint) {
        const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.userAgent || navigator.platform || '');
        shortcutHint.textContent = isMac ? '(⌘+↵)' : '(Ctrl+↵)';
      }

      // 15. Right Column Container (Example Switchers, Response View Toggle & Table Controls)
      const codeContainer = document.getElementById('code-container');
      if (codeContainer) {
        codeContainer.addEventListener('change', (e) => {
          if (e.target.id === 'select-right-example' || e.target.id === 'select-try-example') {
            setRequestBodyExample(e.target.value);
          }
        });

        codeContainer.addEventListener('click', async (e) => {
          const viewBtn = e.target.closest('.try-resp-view-btn');
          if (viewBtn) {
            const viewMode = viewBtn.getAttribute('data-resp-view');
            if (viewMode === 'json' || viewMode === 'table') {
              state.liveResponseView = viewMode;
              renderLiveResponseOutput();
            }
            return;
          }

          if (e.target.closest('#btn-close-nested-table')) {
            closeNestedTable(0);
            return;
          }

          const crumbBtn = e.target.closest('.try-table-breadcrumb-btn');
          if (crumbBtn) {
            const depth = parseInt(crumbBtn.getAttribute('data-stack-depth') || '0', 10);
            closeNestedTable(isNaN(depth) ? 0 : depth);
            return;
          }

          const nestedTrigger = e.target.closest('[data-nested-idx]');
          if (nestedTrigger) {
            const idx = parseInt(nestedTrigger.getAttribute('data-nested-idx'), 10);
            if (!isNaN(idx)) {
              openNestedTable(idx);
            }
            return;
          }

          const sortTh = e.target.closest('.try-table-sort-th');
          if (sortTh) {
            const col = sortTh.getAttribute('data-sort-col');
            if (col !== null) {
              if (state.liveResponseSortCol !== col) {
                state.liveResponseSortCol = col;
                state.liveResponseSortDir = 'asc';
              } else if (state.liveResponseSortDir === 'asc') {
                state.liveResponseSortDir = 'desc';
              } else {
                state.liveResponseSortCol = null;
                state.liveResponseSortDir = null;
              }
              const body = getActiveTableBody();
              if (body && typeof body === 'object') {
                const dataset = extractTableDataset(body);
                if (dataset.rows && dataset.columns) {
                  const visible = getFilteredAndSortedRows(dataset);
                  const theadRow = document.getElementById('try-response-table-thead-row');
                  const tbody = document.getElementById('try-response-table-tbody');
                  if (theadRow) theadRow.innerHTML = buildTableHeaderHtml(dataset.columns);
                  if (tbody) tbody.innerHTML = buildTableRowsHtml(visible, dataset.columns);
                }
              }
            }
            return;
          }

          if (e.target.closest('#btn-copy-resp-csv')) {
            const body = getActiveTableBody();
            if (body && typeof body === 'object') {
              const dataset = extractTableDataset(body);
              if (dataset.rows && dataset.columns) {
                const visible = getFilteredAndSortedRows(dataset);
                const csv = datasetToCsv(dataset.columns, visible);
                try {
                  await navigator.clipboard.writeText(csv);
                  showToast(`Copied ${visible.length} rows as CSV`, 'success');
                } catch (err) {
                  showToast('Failed to copy CSV', 'error');
                }
              }
            }
            return;
          }

          const cell = e.target.closest('.try-table-cell');
          if (cell) {
            const copyVal = cell.getAttribute('data-copy-value');
            if (copyVal !== null) {
              try {
                await navigator.clipboard.writeText(copyVal);
                showToast('Cell value copied', 'success');
              } catch (err) {
                showToast('Failed to copy cell', 'error');
              }
            }
          }
        });

        codeContainer.addEventListener('input', (e) => {
          if (e.target.id === 'try-response-table-filter') {
            state.liveResponseFilter = e.target.value;
            const body = getActiveTableBody();
            if (body && typeof body === 'object') {
              const dataset = extractTableDataset(body);
              const visible = getFilteredAndSortedRows(dataset);
              const tbody = document.getElementById('try-response-table-tbody');
              const countEl = document.getElementById('try-response-table-count');
              if (tbody) tbody.innerHTML = buildTableRowsHtml(visible, dataset.columns);
              if (countEl) {
                countEl.textContent = visible.length === dataset.rows.length
                  ? dataset.sourceLabel
                  : `${visible.length} / ${dataset.rows.length} rows`;
              }
            }
          }
        });
      }

      // 16. Interactive Input Changes (Event Delegation)
      const interactiveInputsContainer = document.getElementById('interactive-inputs-container');
      if (interactiveInputsContainer) {
        interactiveInputsContainer.addEventListener('click', (e) => {
          const toggleBtn = e.target.closest('#btn-toggle-live-mask');
          if (toggleBtn) {
            const liveInput = document.getElementById('live-auth-input');
            if (liveInput) {
              const isPassword = liveInput.type === 'password';
              liveInput.type = isPassword ? 'text' : 'password';
              toggleBtn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5" id="icon-live-mask"></i>`;
              lucide.createIcons();
            }
          }
        });
        interactiveInputsContainer.addEventListener('input', (e) => {
          if (e.target.id === 'live-server-url-input') {
            state.liveServerUrl = e.target.value;
            renderCodeSnippet();

          } else if (e.target.classList.contains('live-param-input')) {
            const paramName = e.target.getAttribute('data-param-name');
            state.liveParamValues[paramName] = e.target.value;
            renderCodeSnippet();
          } else if (e.target.id === 'interactive-body-input') {
            state.liveBodyText = e.target.value;
            renderCodeSnippet();
          }
        });
      }

      // 17. Details View Changes & Clicks (Response tabs, Request Body tabs, Example Switchers, Copy buttons)
      const detailsView = document.getElementById('endpoint-details-view');
      if (detailsView) {
        // Change events for example select dropdowns
        detailsView.addEventListener('change', (e) => {
          if (e.target.id === 'select-rb-example') {
            setRequestBodyExample(e.target.value);
          } else if (e.target.id === 'select-resp-example') {
            setResponseExample(e.target.value);
          }
        });

        detailsView.addEventListener('click', async (e) => {
          // Request Body Example Pill Click
          const rbPill = e.target.closest('.rb-example-pill');
          if (rbPill) {
            const key = rbPill.getAttribute('data-rb-example-key');
            if (key) setRequestBodyExample(key);
            return;
          }

          // Response Example Pill Click
          const respPill = e.target.closest('.resp-example-pill');
          if (respPill) {
            const key = respPill.getAttribute('data-resp-example-key');
            if (key) setResponseExample(key);
            return;
          }

          // Response status code tab
          const respTab = e.target.closest('.response-code-tab');
          if (respTab) {
            const code = respTab.getAttribute('data-response-code');
            if (code) setActiveResponseCode(code);
            return;
          }

          // Request Body tabs
          if (e.target.closest('#btn-rb-tab-example')) {
            setRequestBodyTab('example');
            return;
          }
          if (e.target.closest('#btn-rb-tab-schema')) {
            setRequestBodyTab('schema');
            return;
          }

          // Copy Path Button
          if (e.target.closest('#btn-copy-path')) {
            const ep = getSelectedEndpoint();
            if (ep) {
              await navigator.clipboard.writeText(ep.path);
              showToast('Path copied to clipboard', 'success');
            }
            return;
          }

          // Copy Request Body Example
          if (e.target.closest('#btn-copy-rb-example')) {
            const ep = getSelectedEndpoint();
            if (ep && ep.requestBody) {
              const examples = ep.requestBody.examples || [];
              const activeEx = examples.find(x => x.key === state.activeRequestBodyExampleKey) || examples[0];
              const valToCopy = activeEx ? activeEx.value : ep.requestBody.exampleData;
              if (valToCopy !== undefined) {
                await navigator.clipboard.writeText(JSON.stringify(valToCopy, null, 2));
                showToast('Payload copied to clipboard', 'success');
              }
            }
            return;
          }

          // Copy Response Example
          if (e.target.closest('#btn-copy-resp-example')) {
            const ep = getSelectedEndpoint();
            const activeResp = ep?.responses.find(r => r.statusCode === state.activeResponseCode);
            if (activeResp) {
              const examples = activeResp.examples || [];
              const activeEx = examples.find(x => x.key === state.activeResponseExampleKey) || examples[0];
              const valToCopy = activeEx ? activeEx.value : activeResp.exampleData;
              if (valToCopy !== undefined) {
                await navigator.clipboard.writeText(JSON.stringify(valToCopy, null, 2));
                showToast('Response JSON copied to clipboard', 'success');
              }
            }
            return;
          }
        });
      }

      // 18. Variables Modal Event Handlers
      const variablesModal = document.getElementById('variables-modal');
      const openVarBtn = document.getElementById('btn-open-variables-modal');
      const closeVarBtn = document.getElementById('btn-close-variables-modal');
      const cancelVarBtn = document.getElementById('btn-cancel-variables-modal');
      const saveVarBtn = document.getElementById('btn-save-variables-modal');
      const clearAllVarsBtn = document.getElementById('btn-clear-all-variables');
      const addVarRowBtn = document.getElementById('btn-add-variable-row');
      const varRowsContainer = document.getElementById('variables-rows-container');

      const toggleVariablesModal = (open) => {
        if (!variablesModal) return;
        if (open) {
          renderVariablesModalRows(state.variables);
          variablesModal.classList.remove('hidden');
        } else {
          variablesModal.classList.add('hidden');
        }
      };

      if (openVarBtn) openVarBtn.addEventListener('click', () => toggleVariablesModal(true));
      if (closeVarBtn) closeVarBtn.addEventListener('click', () => toggleVariablesModal(false));
      if (cancelVarBtn) cancelVarBtn.addEventListener('click', () => toggleVariablesModal(false));
      if (variablesModal) {
        variablesModal.addEventListener('click', (e) => {
          if (e.target === variablesModal) toggleVariablesModal(false);
        });
      }

      // Live Client button to open variables modal
      document.addEventListener('click', (e) => {
        if (e.target.closest('#btn-live-open-variables')) {
          toggleVariablesModal(true);
        }
      });

      if (addVarRowBtn) {
        addVarRowBtn.addEventListener('click', () => {
          // Read current rows first
          const currentRows = [];
          if (varRowsContainer) {
            const rows = varRowsContainer.querySelectorAll('.variable-row');
            rows.forEach(r => {
              const label = r.querySelector('.var-label-input')?.value || '';
              const val = r.querySelector('.var-value-input')?.value || '';
              currentRows.push({ label, value: val });
            });
          }
          currentRows.push({ label: '', value: '' });
          renderVariablesModalRows(currentRows);
          // Focus the new row's label
          setTimeout(() => {
            const inputs = varRowsContainer?.querySelectorAll('.var-label-input');
            if (inputs && inputs.length > 0) inputs[inputs.length - 1].focus();
          }, 30);
        });
      }

      if (varRowsContainer) {
        // Toggle mask or remove row
        varRowsContainer.addEventListener('click', (e) => {
          const maskBtn = e.target.closest('.btn-toggle-var-mask');
          if (maskBtn) {
            const input = maskBtn.closest('.variable-row')?.querySelector('.var-value-input');
            if (input) {
              const isPassword = input.type === 'password';
              input.type = isPassword ? 'text' : 'password';
              maskBtn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5"></i>`;
              lucide.createIcons();
            }
            return;
          }

          const removeBtn = e.target.closest('.btn-remove-var-row');
          if (removeBtn) {
            const row = removeBtn.closest('.variable-row');
            if (row) {
              row.remove();
              // If empty, add back an empty row
              if (varRowsContainer.querySelectorAll('.variable-row').length === 0) {
                renderVariablesModalRows([{ label: '', value: '' }]);
              }
            }
          }
        });

        // Update hint on label input
        varRowsContainer.addEventListener('input', (e) => {
          if (e.target.classList.contains('var-label-input')) {
            const hint = e.target.closest('.variable-row')?.querySelector('.var-ref-hint');
            if (hint) {
              const norm = normalizeVariableKey(e.target.value) || 'KEY';
              hint.textContent = `{${norm}}`;
            }
          }
        });
      }

      if (saveVarBtn) {
        saveVarBtn.addEventListener('click', () => {
          const newVars = [];
          if (varRowsContainer) {
            const rows = varRowsContainer.querySelectorAll('.variable-row');
            rows.forEach(r => {
              const label = (r.querySelector('.var-label-input')?.value || '').trim();
              const val = r.querySelector('.var-value-input')?.value || '';
              if (label) {
                newVars.push({ label, value: val });
              }
            });
          }
          saveVariablesToStorage(newVars);
          toggleVariablesModal(false);
          showToast('Variables saved successfully', 'success');
        });
      }

      if (clearAllVarsBtn) {
        clearAllVarsBtn.addEventListener('click', () => {
          saveVariablesToStorage([]);
          toggleVariablesModal(false);
          showToast('All variables cleared', 'info');
        });
      }

      // 16. Alert Dismiss Button
      const dismissAlertBtn = document.getElementById('btn-dismiss-alert');
      if (dismissAlertBtn) {
        dismissAlertBtn.addEventListener('click', clearAlert);
      }

      // 17. Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        // Escape: Close Variables modal or exit Live Client full screen
        if (e.key === 'Escape') {
          const varsModal = document.getElementById('variables-modal');
          if (varsModal && !varsModal.classList.contains('hidden')) {
            varsModal.classList.add('hidden');
            return;
          }
          if (state.codePanelFullscreen) {
            toggleCodePanelFullscreen(false);
            return;
          }
        }

        // Cmd/Ctrl+K: Focus search
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          const filterInput = document.getElementById('input-filter');
          if (filterInput) filterInput.focus();
          return;
        }

        // Check platform: Mac uses Alt (Option) + Return, non-Mac uses Ctrl + Enter
        const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.userAgent || navigator.platform || '');
        const isTrigger = isMac ? (e.metaKey && e.key === 'Enter') : (e.ctrlKey && e.key === 'Enter');

        if (isTrigger) {
          // If variables modal is open, don't trigger request
          const varsModal = document.getElementById('variables-modal');
          if (varsModal && !varsModal.classList.contains('hidden')) return;

          e.preventDefault();
          const runRequestBtn = document.getElementById('btn-execute-request');
          if (runRequestBtn && !runRequestBtn.disabled) {
            executeLiveRequest();
          }
        }
      });
    }

    /**
     * ============================================================================
     * 12. APPLICATION INITIALIZATION
     * ============================================================================
     */
    function initApp() {
      // Dark Mode detection
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        state.darkMode = true;
        document.documentElement.classList.add('dark');
      } else {
        state.darkMode = false;
        document.documentElement.classList.remove('dark');
      }

      // Setup DOM events
      initEventListeners();

      // Load Embedded Spec if present, else show clean welcome / upload state
      if (typeof EMBEDDED_OPENAPI_SPEC !== 'undefined' && EMBEDDED_OPENAPI_SPEC) {
        setSpec(EMBEDDED_OPENAPI_SPEC);
      } else {
        renderEmptyState();
      }

      // Initialize variables UI state
      updateVariablesUI();

      // Initialize icons
      lucide.createIcons();
    }

    // Launch application on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>

        >
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Add Variable</span>

      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800">

          Clear All
        </button>
        <div class="flex items-center gap-2">
          <button id="btn-cancel-variables-modal" class="px-3 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700">
            Cancel
          </button>
          <button id="btn-save-variables-modal" class="px-4 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg shadow-sm transition">

        </div>
