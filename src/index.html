      } else {
        lines.push(``);
        lines.push(`\treq, err := http.NewRequest("${method}", apiURL, nil)`);
      }

      lines.push(`\tif err != nil {`);
      lines.push(`\t\tlog.Fatalf("Request build error: %v", err)`);
      lines.push(`\t}`);
      lines.push(``);
      lines.push(`\treq.Header.Set("Accept", "application/json")`);
      if (endpoint.requestBody) {
        lines.push(`\treq.Header.Set("Content-Type", "${endpoint.requestBody.contentType || 'application/json'}")`);
      }
      lines.push(`\treq.Header.Set("Authorization", "Bearer {API_TOKEN}")`);
      for (const h of headerParams) {
        if (h.name.toLowerCase() === 'authorization') continue;
        const val = liveParamValues[h.name] !== undefined ? liveParamValues[h.name] : (h.example || h.default || 'demo_token');
        lines.push(`\treq.Header.Set("${h.name}", "${val}")`);
      }

      lines.push(``);
      lines.push(`\tclient := &http.Client{}`);
      lines.push(`\tresp, err := client.Do(req)`);
      lines.push(`\tif err != nil {`);
      lines.push(`\t\tlog.Fatalf("Request execution error: %v", err)`);
      lines.push(`\t}`);
      lines.push(`\tdefer resp.Body.Close()`);
      lines.push(``);
      lines.push(`\tbody, err := io.ReadAll(resp.Body)`);
      lines.push(`\tif err != nil {`);
      lines.push(`\t\tlog.Fatalf("Read body error: %v", err)`);
      lines.push(`\t}`);
      lines.push(``);
      lines.push(`\tfmt.Printf("HTTP Status: %s\\n", resp.Status)`);
      lines.push(`\tfmt.Println(string(body))`);
      lines.push(`}`);

      return lines.join('\n');
    }

    /**
     * Unified Multi-Language Code Dispatcher
     */
    function generateCodeForLang(lang, endpoint, baseUrl, liveParamValues = {}, liveBodyText = null) {
      // Substitute {VARIABLE} references for code generation
      const substitutedParams = {};
      for (const [k, v] of Object.entries(liveParamValues || {})) {
        substitutedParams[k] = substituteVariables(v);
      }
      const substitutedBody = substituteVariables(liveBodyText);
      const substitutedBase = substituteVariables(baseUrl);

      switch (lang) {
        case 'curl':
          return generateCurlCode(endpoint, substitutedBase, substitutedParams, substitutedBody);
        case 'javascript':
        case 'js':
          return generateFetchCode(endpoint, substitutedBase, substitutedParams, substitutedBody);
        case 'php':
          return generatePhpCode(endpoint, substitutedBase, substitutedParams, substitutedBody);
        case 'golang':
        case 'go':
          return generateGolangCode(endpoint, substitutedBase, substitutedParams, substitutedBody);
        default:
          return generateCurlCode(endpoint, substitutedBase, substitutedParams, substitutedBody);
      }
    }



    /**
     * ============================================================================
     * 5. SAFE MARKDOWN RENDERING HELPER
     * ============================================================================
     */
    function renderMarkdown(md) {
      if (!md) return '';

      // 1. Extract and preserve fenced code blocks before escaping
      const codeBlocks = [];
      let out = md.replace(/```([a-zA-Z0-9_-]*)\r?\n([\s\S]*?)```/g, (match, lang, code) => {
        const id = `___FENCED_CODE_${codeBlocks.length}___`;
        codeBlocks.push({ lang: lang || 'text', code: code.replace(/\r?\n$/, '') });
        return id;
      });

      // 2. Extract and preserve multi-line GFM Alert Boxes & Blockquotes before escaping HTML
      const alertBlocks = [];
      out = out.replace(/(?:^[ \t]*>[ \t]?.*(?:\r?\n|$))+/gm, (block) => {
        const rawLines = block.split(/\r?\n/).filter(l => l.trim().length > 0);
        const contentLines = rawLines.map(l => l.replace(/^[ \t]*>[ \t]?/, ''));
        const firstLine = contentLines[0] || '';

        const alertMatch = firstLine.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION|INFO)\](?:\s+(.*))?$/i);
        const id = `___ALERT_BLOCK_${alertBlocks.length}___`;

        if (alertMatch) {
          const type = alertMatch[1].toUpperCase();
          const inlineTitle = alertMatch[2] || '';
          const bodyLines = contentLines.slice(1);
          if (inlineTitle) bodyLines.unshift(inlineTitle);
          alertBlocks.push({ isAlert: true, type, body: bodyLines.join('\n').trim() });
        } else {
          alertBlocks.push({ isAlert: false, body: contentLines.join('\n').trim() });
        }
        return `\n\n${id}\n\n`;
      });

      // 3. Escape HTML entities to protect against XSS
      out = out
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      // Headings
      out = out.replace(/^### (.*$)/gim, '<h4 class="text-base font-bold text-slate-900 dark:text-slate-100 mt-6 mb-2">$1</h4>');
      out = out.replace(/^## (.*$)/gim, '<h3 class="text-xl font-bold text-slate-900 dark:text-slate-100 mt-8 mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">$1</h3>');
      out = out.replace(/^# (.*$)/gim, '<h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-slate-100 mt-2 mb-4 tracking-tight">$1</h2>');

      // Inline formatting helper for text inside alerts and paragraphs
      function formatInline(str) {
        let s = str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
        s = s.replace(/\*\*\*(.*?)\*\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-slate-100"><em>$1</em></strong>');
        s = s.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-slate-100">$1</strong>');
        s = s.replace(/\*(.*?)\*/g, '<em class="italic">$1</em>');
        s = s.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-blue-600 dark:text-blue-400 text-xs font-mono font-medium">$1</code>');
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400 hover:underline">$1</a>');
        return s.replace(/\r?\n/g, '<br>');
      }

      // Bold & Italic
      out = out.replace(/\*\*\*(.*?)\*\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-slate-100"><em>$1</em></strong>');
      out = out.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-slate-100">$1</strong>');
      out = out.replace(/\*(.*?)\*/g, '<em class="italic">$1</em>');

      // Monospace code
      out = out.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-blue-600 dark:text-blue-400 text-xs font-mono font-medium">$1</code>');

      // Hyperlinks
      out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400 hover:underline">$1</a>');

      // Bullet lists
      out = out.replace(/^\s*-\s+(.*$)/gim, '<li class="ml-4 list-disc text-slate-600 dark:text-slate-300 my-1">$1</li>');

      // Numbered lists
      out = out.replace(/^\s*([0-9]+)\.\s+(.*$)/gim, '<li class="ml-5 list-decimal text-slate-600 dark:text-slate-300 my-1">$2</li>');

      // Paragraphs
      out = out.replace(/\n\n+/g, '</p><p class="mt-3 text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed">');

      // 4. Restore Alert Blocks & Blockquotes
      const alertConfigs = {
        NOTE: {
          title: 'Note',
          icon: 'info',
          classes: 'border-blue-500 bg-blue-50/80 dark:bg-blue-950/40 text-blue-900 dark:text-blue-200 border-l-4',
          iconClass: 'text-blue-600 dark:text-blue-400'
        },
        INFO: {
          title: 'Info',
          icon: 'info',
          classes: 'border-blue-500 bg-blue-50/80 dark:bg-blue-950/40 text-blue-900 dark:text-blue-200 border-l-4',
          iconClass: 'text-blue-600 dark:text-blue-400'
        },
        TIP: {
          title: 'Tip',
          icon: 'lightbulb',
          classes: 'border-emerald-500 bg-emerald-50/80 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 border-l-4',
          iconClass: 'text-emerald-600 dark:text-emerald-400'
        },
        IMPORTANT: {
          title: 'Important',
          icon: 'alert-circle',
          classes: 'border-violet-500 bg-violet-50/80 dark:bg-violet-950/40 text-violet-900 dark:text-violet-200 border-l-4',
          iconClass: 'text-violet-600 dark:text-violet-400'
        },
        WARNING: {
          title: 'Warning',
          icon: 'alert-triangle',
          classes: 'border-amber-500 bg-amber-50/80 dark:bg-amber-950/40 text-amber-900 dark:text-amber-200 border-l-4',
          iconClass: 'text-amber-600 dark:text-amber-400'
        },
        CAUTION: {
          title: 'Caution',
          icon: 'shield-alert',
          classes: 'border-rose-500 bg-rose-50/80 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200 border-l-4',
          iconClass: 'text-rose-600 dark:text-rose-400'
        }
      };

      for (let i = 0; i < alertBlocks.length; i++) {
        const ab = alertBlocks[i];
        const formattedBody = formatInline(ab.body);
        let blockHtml = '';
        if (ab.isAlert) {
          const cfg = alertConfigs[ab.type] || alertConfigs.NOTE;
          blockHtml = `
            <div class="my-4 p-3.5 rounded-r-xl ${cfg.classes} text-xs sm:text-sm space-y-1.5 shadow-sm">
              <div class="font-bold flex items-center gap-1.5 ${cfg.iconClass}">
                <i data-lucide="${cfg.icon}" class="w-4 h-4 flex-shrink-0"></i>
                <span>${cfg.title}</span>
              </div>
              <div class="leading-relaxed opacity-95">${formattedBody}</div>
            </div>
          `;
        } else {
          blockHtml = `
            <div class="my-4 pl-4 border-l-4 border-slate-300 dark:border-slate-700 bg-slate-50/60 dark:bg-slate-900/40 p-3 rounded-r-lg text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed">
              ${formattedBody}
            </div>
          `;
        }
        out = out.replace(`___ALERT_BLOCK_${i}___`, blockHtml);
      }

      // 5. Restore code blocks with highlight formatting
      for (let i = 0; i < codeBlocks.length; i++) {
        const { lang, code } = codeBlocks[i];
        let highlighted = '';
        try {
          if (window.hljs && hljs.getLanguage(lang)) {
            highlighted = hljs.highlight(code, { language: lang }).value;
          } else {
            highlighted = highlightCode(code, lang);
          }
        } catch (e) {
          highlighted = highlightCode(code, lang);
        }

        const blockHtml = `
          <div class="my-5 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 bg-slate-950 text-slate-100 shadow-sm">
            <div class="flex items-center justify-between px-4 py-2 bg-slate-900 border-b border-slate-800 text-xs text-slate-400 font-mono">
              <span>${lang}</span>
            </div>
            <pre class="p-4 text-xs font-mono overflow-x-auto leading-relaxed"><code class="language-${lang}">${highlighted}</code></pre>
          </div>
        `;
        out = out.replace(`___FENCED_CODE_${i}___`, blockHtml);
      }

      return `<div class="prose max-w-none text-slate-600 dark:text-slate-300"><p class="text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed">${out}</p></div>`;
    }

    /**
     * Built-in Pure Vanilla JS Syntax Highlighting Engine (Atom One Dark theme)
     * Provides instant, reliable syntax highlighting with Highlight.js integration and pure-JS fallback.
     */
    function highlightJsFallback(code) {
      let html = code
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const tokens = [];
      const addToken = (cls, content) => {
        const id = `___TOKEN_${tokens.length}___`;
        tokens.push(`<span class="${cls}">${content}</span>`);
        return id;
      };

      // 1. Strings (template literals, double quotes, single quotes)
      html = html.replace(/(`(?:\\`|[\s\S])*?`|"(?:\\"|[^"\n])*"|'(?:\\'|[^'\n])*')/g, (m) => addToken('token-string hljs-string', m));

      // 2. Comments (// ... or /* ... */)
      html = html.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g, (m) => addToken('token-comment hljs-comment', m));

      // 3. Keywords
      html = html.replace(/\b(async|await|function|const|let|var|try|catch|finally|throw|return|if|else|for|while|switch|case|break|default|new|typeof|instanceof|class|extends|import|export|from)\b/g, '<span class="token-keyword hljs-keyword">$1</span>');

      // 4. Built-ins
      html = html.replace(/\b(URL|URLSearchParams|fetch|JSON|console|Promise|Error|encodeURIComponent|Response|Request|Headers)\b/g, '<span class="token-builtin hljs-built_in">$1</span>');

      // 5. Booleans, null, numbers
      html = html.replace(/\b(true|false|null|undefined)\b/g, '<span class="token-boolean hljs-literal">$1</span>');
      html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="token-number hljs-number">$1</span>');

      // 6. Function declarations & calls
      html = html.replace(/\b([a-zA-Z_$][a-zA-Z0-9_$]*)(?=\s*\()/g, '<span class="token-function hljs-title function_">$1</span>');

      // Restore string & comment tokens
      for (let i = 0; i < tokens.length; i++) {
        html = html.replace(`___TOKEN_${i}___`, tokens[i]);
      }

      return html;
    }

    function highlightJsonFallback(jsonStr) {
      let html = jsonStr
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      return html.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        function (match) {
          let cls = 'token-number hljs-number';
          if (/^"/.test(match)) {
            if (/:$/.test(match)) {
              cls = 'token-key hljs-attr';
            } else {
              cls = 'token-string hljs-string';
            }
          } else if (/true|false/.test(match)) {
            cls = 'token-boolean hljs-literal';
          } else if (/null/.test(match)) {
            cls = 'token-null hljs-literal';
          }
          return `<span class="${cls}">${match}</span>`;
        }
      );
    }

    function highlightBashFallback(code) {
      let html = code
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const tokens = [];
      const addToken = (cls, content) => {
        const id = `___TOKEN_${tokens.length}___`;
        tokens.push(`<span class="${cls}">${content}</span>`);
        return id;
      };

      // Strings (double quotes and single quotes)
      html = html.replace(/("(?:\\"|[^"\n])*"|'(?:\\'|[^'\n])*')/g, (m) => addToken('token-string hljs-string', m));

      // Comments
      html = html.replace(/(#[^\n]*)/g, (m) => addToken('token-comment hljs-comment', m));

      // Flags (-X, -H, -d, etc.)
      html = html.replace(/(\s)(-[a-zA-Z0-9]+|--[a-zA-Z0-9-]+)/g, '$1<span class="token-param hljs-attribute">$2</span>');

      // Commands
      html = html.replace(/\b(curl|cat|echo|grep|awk|sed)\b/g, '<span class="token-keyword hljs-keyword">$1</span>');

      for (let i = 0; i < tokens.length; i++) {
        html = html.replace(`___TOKEN_${i}___`, tokens[i]);
      }
      return html;
    }

    function highlightPhpFallback(code) {
      let html = code
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const tokens = [];
      const addToken = (cls, content) => {
        const id = `___TOKEN_${tokens.length}___`;
        tokens.push(`<span class="${cls}">${content}</span>`);
        return id;
      };

      // Strings
      html = html.replace(/("(?:\\"|[^"\n])*"|'(?:\\'|[^'\n])*')/g, (m) => addToken('token-string hljs-string', m));

      // Comments
      html = html.replace(/(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)/g, (m) => addToken('token-comment hljs-comment', m));

      // PHP tags
      html = html.replace(/(&lt;\?php|\?&gt;)/g, '<span class="token-tag hljs-meta">$1</span>');

      // Variables ($var)
      html = html.replace(/(\$[a-zA-Z_\x7f-\xff][a-zA-Z0-9_\x7f-\xff]*)/g, '<span class="token-variable hljs-variable">$1</span>');

      // Keywords
      html = html.replace(/\b(echo|return|if|else|function|array|true|false|null|new|class|public|private|protected|foreach|as|while)\b/g, '<span class="token-keyword hljs-keyword">$1</span>');

      // Functions
      html = html.replace(/\b(curl_init|curl_setopt_array|curl_exec|curl_getinfo|curl_errno|curl_error|curl_close|json_encode|json_decode|http_build_query)\b/g, '<span class="token-function hljs-title function_">$1</span>');

      for (let i = 0; i < tokens.length; i++) {
        html = html.replace(`___TOKEN_${i}___`, tokens[i]);
      }
      return html;
    }

    function highlightGoFallback(code) {
      let html = code
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const tokens = [];
      const addToken = (cls, content) => {
        const id = `___TOKEN_${tokens.length}___`;
        tokens.push(`<span class="${cls}">${content}</span>`);
        return id;
      };

      // Strings
      html = html.replace(/(`(?:\\`|[\s\S])*?`|"(?:\\"|[^"\n])*")/g, (m) => addToken('token-string hljs-string', m));

      // Comments
      html = html.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g, (m) => addToken('token-comment hljs-comment', m));

      // Keywords
      html = html.replace(/\b(package|import|func|var|const|type|struct|if|else|return|nil|true|false|defer|for|range|switch|case)\b/g, '<span class="token-keyword hljs-keyword">$1</span>');

      // Packages & types
      html = html.replace(/\b(main|string|byte|int|int64|float64|bool|error|fmt|http|url|io|log|bytes)\b/g, '<span class="token-builtin hljs-built_in">$1</span>');

      // Functions
      html = html.replace(/\b([a-zA-Z_$][a-zA-Z0-9_$]*)(?=\s*\()/g, '<span class="token-function hljs-title function_">$1</span>');

      for (let i = 0; i < tokens.length; i++) {
        html = html.replace(`___TOKEN_${i}___`, tokens[i]);
      }
      return html;
    }

    function highlightCode(code, lang = 'curl') {
      if (!code) return '';
      const langMap = {
        'curl': 'bash',
        'bash': 'bash',
        'javascript': 'javascript',
        'js': 'javascript',
        'php': 'php',
        'golang': 'go',
        'go': 'go',
        'json': 'json'
      };
      const hljsLang = langMap[lang] || lang;
      if (typeof hljs !== 'undefined' && typeof hljs.highlight === 'function') {
        try {
          const res = hljs.highlight(code, { language: hljsLang, ignoreIllegals: true });
          if (res && res.value) {
            return res.value;
          }
        } catch (e) {
          // Fall back gracefully
        }
      }
      if (lang === 'json') return highlightJsonFallback(code);
      if (lang === 'curl' || lang === 'bash') return highlightBashFallback(code);
      if (lang === 'php') return highlightPhpFallback(code);
      if (lang === 'golang' || lang === 'go') return highlightGoFallback(code);
      return highlightJsFallback(code);
    }

    /**
     * ============================================================================
     * 6. CENTRAL STATE MANAGEMENT
     * ============================================================================
     */
    const state = {
      rawSpec: null,
      parsedSpec: null,
      selectedPageId: null,
      selectedEndpointId: null,
      filterText: '',
      selectedTag: 'all',
      activeResponseCode: null,
      activeResponseExampleKey: null,   // key of active response example
      activeRequestBodyTab: 'example', // 'example' | 'schema'
      activeRequestBodyExampleKey: null, // key of active request body example
      activeRightTab: 'code',          // 'code' | 'try'
      activeMobileTab: 'docs',         // 'docs' | 'code'
      selectedCodeLang: 'curl',        // 'curl' | 'javascript' | 'php' | 'golang'
      mobileNavOpen: false,
      sidebarCollapsed: false,
      codePanelCollapsed: false,
      codePanelFullscreen: false,
      darkMode: false,
      variables: loadVariablesFromStorage(),
      liveServerUrl: null,
      liveParamValues: {},
      liveBodyText: null,
      endpointSessionState: {},
      liveResponseView: 'json',        // 'json' | 'table'
      liveResponseFilter: '',
      liveResponseSortCol: null,
      liveResponseSortDir: null,       // null | 'asc' | 'desc'
      liveResponseTableStack: [],

        statusCode: null,
        statusText: null,
        timeMs: null,
        body: null,
        error: null
      }
    };

    /**
     * ============================================================================
     * 7. STATE ACTIONS & DISPATCH PIPELINE
     * ============================================================================
     */
    function setSpec(rawJson) {
      try {
        const parsed = parseOpenApiSpec(rawJson);
        state.rawSpec = rawJson;
        state.parsedSpec = parsed;
        state.filterText = '';
        state.selectedTag = 'all';

        // Select first page if present, else first endpoint
        if (parsed.pages && parsed.pages.length > 0) {
          selectPage(parsed.pages[0].id, false);
        } else if (parsed.endpoints.length > 0) {
          selectEndpoint(parsed.endpoints[0].id, false);
        } else {
          state.selectedPageId = null;
          state.selectedEndpointId = null;
          if (state.codePanelFullscreen) toggleCodePanelFullscreen(false);
        }

        clearAlert();
        renderHeader();
        renderSidebar();
        renderDetails();
        renderCodeSnippet();
        renderInteractiveClient();

        showToast(`Loaded ${parsed.info.title} (${parsed.endpoints.length} endpoints)`, 'success');
      } catch (err) {
        console.error("Failed to load specification:", err);
        showAlert(`Specification Error: ${err.message}`);
        showToast("Failed to parse OpenAPI specification", "error");
      }
    }

    function getSelectedPage() {
      if (!state.parsedSpec) return null;
      if (state.parsedSpec.pages) {
        const found = state.parsedSpec.pages.find(p => p.id === state.selectedPageId);
        if (found) return found;
      }
      if (state.parsedSpec.pathPages) {
        const foundPathPage = state.parsedSpec.pathPages.find(p => p.id === state.selectedPageId);
        if (foundPathPage) return foundPathPage;
      }
      return null;
    }

    function selectPage(pageId, updateUrlHash = true) {
      if (state.codePanelFullscreen) {
        toggleCodePanelFullscreen(false);
      }
      state.selectedPageId = pageId;
      state.selectedEndpointId = null;

      if (state.mobileNavOpen) {
        toggleMobileDrawer(false);
      }

      // Hide right code column and expand button when reading custom documentation page
      const codeCol = document.getElementById("code-container");
      if (codeCol) {
        codeCol.classList.add("lg:hidden");
      }
      const expandBtn = document.getElementById('btn-expand-code-panel');
      if (expandBtn) {
        expandBtn.classList.add('hidden');
        expandBtn.classList.remove('lg:flex');
      }

      renderSidebar();
      renderDetails();

      const docsEl = document.getElementById("docs-container");
      if (docsEl) docsEl.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectEndpoint(endpointId, updateUrlHash = true) {
      // 1. Save state of current endpoint before switching
      if (state.selectedEndpointId && state.selectedEndpointId !== endpointId) {
        state.endpointSessionState[state.selectedEndpointId] = {
          liveParamValues: { ...(state.liveParamValues || {}) },
          liveBodyText: state.liveBodyText,
          activeRequestBodyExampleKey: state.activeRequestBodyExampleKey,
          activeResponseCode: state.activeResponseCode,
          activeResponseExampleKey: state.activeResponseExampleKey
        };
      }

      state.selectedEndpointId = endpointId;
      state.selectedPageId = null;

      // Ensure right code column is visible on desktop for endpoints (respecting collapse & fullscreen state)
      const codeCol = document.getElementById("code-container");
      const expandBtn = document.getElementById('btn-expand-code-panel');
      if (codeCol && !state.codePanelFullscreen) {
        if (state.codePanelCollapsed) {
          codeCol.classList.add("lg:hidden");
          if (expandBtn) {
            expandBtn.classList.remove('hidden');
            expandBtn.classList.add('lg:flex');
          }
        } else {
          codeCol.classList.remove("lg:hidden");
          if (expandBtn) {
            expandBtn.classList.add('hidden');
            expandBtn.classList.remove('lg:flex');
          }
        }
      }
      const endpoint = getSelectedEndpoint();
      const savedSession = state.endpointSessionState[endpointId];

      if (savedSession) {
        // Restore user session for this endpoint
        state.activeResponseCode = savedSession.activeResponseCode;
        state.activeResponseExampleKey = savedSession.activeResponseExampleKey;
        state.liveParamValues = { ...(savedSession.liveParamValues || {}) };
        state.activeRequestBodyExampleKey = savedSession.activeRequestBodyExampleKey;
        state.liveBodyText = savedSession.liveBodyText;
      } else {
        // Initialize clean defaults for first visit
        if (endpoint && endpoint.responses.length > 0) {
          state.activeResponseCode = endpoint.responses[0].statusCode;
          state.activeResponseExampleKey = endpoint.responses[0].examples?.[0]?.key || null;
        } else {
          state.activeResponseCode = null;
          state.activeResponseExampleKey = null;
        }

        state.liveParamValues = {};
        if (endpoint) {
          for (const p of endpoint.parameters) {
            if (p.example !== undefined) state.liveParamValues[p.name] = p.example;
            else if (p.default !== undefined) state.liveParamValues[p.name] = p.default;
            else if (p.enum && p.enum.length > 0) state.liveParamValues[p.name] = p.enum[0];
            else state.liveParamValues[p.name] = p.type === 'integer' || p.type === 'number' ? '42' : '';
          }
          if (endpoint.requestBody && endpoint.requestBody.examples && endpoint.requestBody.examples.length > 0) {
            const firstEx = endpoint.requestBody.examples[0];
            state.activeRequestBodyExampleKey = firstEx.key;
            state.liveBodyText = JSON.stringify(firstEx.value, null, 2);
          } else if (endpoint.requestBody && endpoint.requestBody.exampleData) {
            state.activeRequestBodyExampleKey = 'default';
            state.liveBodyText = JSON.stringify(endpoint.requestBody.exampleData, null, 2);
          } else {
            state.activeRequestBodyExampleKey = null;
            state.liveBodyText = '';
          }
        }
      }

      // Reset live try response
      state.liveResponseFilter = '';
      state.liveResponseSortCol = null;
      state.liveResponseSortDir = null;
      state.liveResponseTableStack = [];
      state.tryRequestState = {
        loading: false,
        statusCode: null,
        statusText: null,
        timeMs: null,
        body: null,
        error: null
      };

      if (state.mobileNavOpen) {
        toggleMobileDrawer(false);
      }

      // Targeted UI updates
      renderSidebar();
      renderDetails();
      renderCodeSnippet();
      renderInteractiveClient();

      // Scroll docs column to top smoothly
      const docsEl = document.getElementById('docs-container');
      if (docsEl) docsEl.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setFilterText(text) {
      state.filterText = (text || '').trim().toLowerCase();
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', state.filterText.length === 0);
      }
      renderSidebar();
    }

    function setSelectedTag(tag) {
      state.selectedTag = tag;
      renderSidebar();
    }

    function setActiveResponseCode(code) {
      state.activeResponseCode = code;
      const endpoint = getSelectedEndpoint();
      const resp = endpoint?.responses?.find(r => r.statusCode === code);
      state.activeResponseExampleKey = resp?.examples?.[0]?.key || null;
      renderResponsesSection();
    }

    function setResponseExample(exampleKey) {
      state.activeResponseExampleKey = exampleKey;
      renderResponsesSection();
    }

    /**
     * 3-way merge for payload attributes:
     * Compares user's current live body with the previous example template.
     * If an attribute was modified by the user (currentVal !== prevVal), the user's custom value is retained.
     * If the attribute was untouched by the user (currentVal === prevVal), the new example's value is applied.
     */
    function mergePayloadAttributes(newExampleVal, prevExampleVal, currentBodyText) {
      if (!currentBodyText || typeof currentBodyText !== 'string' || !currentBodyText.trim()) {
        return newExampleVal;
      }
      try {
        const currentParsed = JSON.parse(currentBodyText);
        if (typeof currentParsed !== 'object' || currentParsed === null || Array.isArray(currentParsed)) {
          return newExampleVal;
        }
        if (typeof newExampleVal !== 'object' || newExampleVal === null || Array.isArray(newExampleVal)) {
          return newExampleVal;
        }

        const prevParsed = (typeof prevExampleVal === 'object' && prevExampleVal !== null) ? prevExampleVal : {};

        function deepMerge(target, current, base) {
          const result = Array.isArray(target) ? [...target] : { ...target };
          for (const key of Object.keys(result)) {
            if (Object.prototype.hasOwnProperty.call(current, key)) {
              const currVal = current[key];
              const tgtVal = result[key];
              const baseVal = base && Object.prototype.hasOwnProperty.call(base, key) ? base[key] : undefined;

              if (
                typeof tgtVal === 'object' && tgtVal !== null && !Array.isArray(tgtVal) &&
                typeof currVal === 'object' && currVal !== null && !Array.isArray(currVal)
              ) {
                result[key] = deepMerge(tgtVal, currVal, (typeof baseVal === 'object' && baseVal !== null) ? baseVal : {});
              } else {
                // If baseVal is present and currVal === baseVal, the user did NOT customize this field.
                // Therefore, allow new example's target value (tgtVal) to take effect!
                // Only preserve currVal if baseVal is undefined or user altered it from baseVal.
                if (baseVal !== undefined && JSON.stringify(currVal) === JSON.stringify(baseVal)) {
                  result[key] = tgtVal;
                } else {
                  result[key] = currVal;
                }
              }
            }
          }
          return result;
        }

        return deepMerge(newExampleVal, currentParsed, prevParsed);
      } catch (e) {
        // If current body text was not valid JSON, fallback to new example
        return newExampleVal;
      }
    }

    function setRequestBodyExample(exampleKey) {
      const endpoint = getSelectedEndpoint();
      if (!endpoint || !endpoint.requestBody || !endpoint.requestBody.examples) return;

      const prevEx = endpoint.requestBody.examples.find(e => e.key === state.activeRequestBodyExampleKey);
      const newEx = endpoint.requestBody.examples.find(e => e.key === exampleKey);
      if (!newEx) return;

      state.activeRequestBodyExampleKey = exampleKey;

      // 3-way merge: retain user-customized attributes, while adopting new example's specific attributes (e.g. message_type)
      const mergedValue = mergePayloadAttributes(newEx.value, prevEx ? prevEx.value : null, state.liveBodyText);
      state.liveBodyText = JSON.stringify(mergedValue, null, 2);

      renderRequestBodySection();
      renderCodeSnippet();
      renderInteractiveClient();
    }

    function getMethodBadgeHtml(method, size = 'sm') {
      const m = method.toUpperCase();
      let colorClasses = '';

      switch (m) {
        case 'GET':
          colorClasses = 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-400 dark:border-emerald-800/80';
          break;
        case 'POST':
          colorClasses = 'bg-[#eff6ff] text-[#1d4ed8] border-[#bfdbfe] dark:bg-[#172554]/60 dark:text-[#60a5fa] dark:border-[#1e40af]/80';
          break;
        case 'PUT':
          colorClasses = 'bg-purple-50 text-purple-700 border-purple-200 dark:bg-purple-950/60 dark:text-purple-400 dark:border-purple-800/80';
          break;
        case 'PATCH':
          colorClasses = 'bg-orange-50 text-orange-700 border-orange-200 dark:bg-orange-950/60 dark:text-orange-400 dark:border-orange-800/80';
          break;
        case 'DELETE':
          colorClasses = 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/60 dark:text-rose-400 dark:border-rose-800/80';
          break;
        default:
          colorClasses = 'bg-slate-100 text-slate-700 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700';
      }

      if (size === 'lg') {
        return `<span class="inline-flex items-center justify-center font-mono font-bold text-xs uppercase px-2.5 py-1 rounded-md border tracking-wide ${colorClasses}">${m}</span>`;
      }
      return `<span class="inline-flex items-center justify-center font-mono font-bold text-[10px] uppercase w-12 px-1 py-0.5 rounded border tracking-tight ${colorClasses}">${m}</span>`;
    }

    /**
     * ============================================================================
     * VARIABLES MANAGEMENT HELPER FUNCTIONS
     * ============================================================================
     */
    function normalizeVariableKey(label) {
      if (!label) return '';
      let clean = String(label).trim().toUpperCase();
      clean = clean.replace(/[^A-Z0-9_]/g, '_');
      clean = clean.replace(/^_+|_+$/g, '');
      return clean;
    }

    function loadVariablesFromStorage() {
      try {
        const stored = localStorage.getItem('openapi_viewer_variables');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.warn('Failed to parse stored variables:', e);
      }

      // Backward compatibility check with openapi_viewer_api_token
      const oldToken = localStorage.getItem('openapi_viewer_api_token') || '';
      return [
        { label: 'API Token', value: oldToken }
      ];
    }

    function saveVariablesToStorage(variables) {
      state.variables = variables;
      try {
        localStorage.setItem('openapi_viewer_variables', JSON.stringify(variables));
      } catch (e) {
        console.warn('Failed to save variables to localStorage:', e);
      }
      // Also sync API Token if present for backward compatibility
      const apiTokenVar = (variables || []).find(v => normalizeVariableKey(v.label) === 'API_TOKEN');
      if (apiTokenVar && apiTokenVar.value && apiTokenVar.value.trim()) {
        localStorage.setItem('openapi_viewer_api_token', apiTokenVar.value.trim());
      } else {
        localStorage.removeItem('openapi_viewer_api_token');
      }

      updateVariablesUI();
      renderCodeSnippet();
      renderInteractiveClient();
    }

    function getResolvedVariablesMap() {
      const map = {};
      for (const v of (state.variables || [])) {
        if (!v || !v.label) continue;
        const key = normalizeVariableKey(v.label);
        if (key) {
          map[key] = v.value || '';
        }
      }
      return map;
    }

    function substituteVariables(text, customVars = null) {
      if (!text || typeof text !== 'string') return text;
      const vars = customVars || getResolvedVariablesMap();
      return text.replace(/\{([a-zA-Z0-9_]+)\}/g, (match, key) => {
        const upper = key.toUpperCase();
        if (Object.prototype.hasOwnProperty.call(vars, upper)) {
          return vars[upper];
        }
        return match;
      });
    }

    function renderSidebar() {
      const navEl = document.getElementById('nav-endpoints-tree');
      const tagFilterContainer = document.getElementById('tag-filter-pills');
      const counterEl = document.getElementById('sidebar-endpoint-counter');
      if (!navEl || !state.parsedSpec) return;

      const { endpoints, tags, pages = [] } = state.parsedSpec;
      const query = state.filterText;
      const selectedTag = state.selectedTag;

      // Filter pages (guides)
      const filteredPages = pages.filter(p => {
        if (!query) return true;
        return p.title.toLowerCase().includes(query) || p.content.toLowerCase().includes(query);
      });

      // Filter endpoints
      const filtered = endpoints.filter(ep => {
        const matchesTag = selectedTag === 'all' || ep.tags.includes(selectedTag);
        if (!matchesTag) return false;

        if (!query) return true;
        const matchesPathPage = ep.pathPage && (
          ep.pathPage.title.toLowerCase().includes(query) ||
          ep.pathPage.content.toLowerCase().includes(query)
        );

        return (
          ep.path.toLowerCase().includes(query) ||
          ep.summary.toLowerCase().includes(query) ||
          ep.method.toLowerCase().includes(query) ||
          ep.tags.some(t => t.toLowerCase().includes(query)) ||
          matchesPathPage
        );
      });

      const pagesCountStr = pages.length > 0 ? `${pages.length} guides, ` : '';
      counterEl.textContent = `${pagesCountStr}${filtered.length} of ${endpoints.length} endpoints`;

      // Render Tag Filter Pills
      let tagHtml = `
        <button
          data-tag="all"
          class="tag-filter-btn px-2 py-0.5 text-[11px] rounded-full font-medium whitespace-nowrap transition border ${selectedTag === 'all' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700 hover:border-slate-300'}"
        >
          All (${endpoints.length})
        </button>
      `;

      for (const t of tags) {
        const count = endpoints.filter(e => e.tags.includes(t.name)).length;
        if (count === 0) continue;
        const isSel = selectedTag === t.name;
        tagHtml += `
          <button
            data-tag="${t.name}"
            class="tag-filter-btn px-2 py-0.5 text-[11px] rounded-full font-medium whitespace-nowrap transition border ${isSel ? 'bg-blue-600 text-white border-blue-600' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700 hover:border-slate-300'}"
          >
            ${t.name} (${count})
          </button>
        `;
      }
      tagFilterContainer.innerHTML = tagHtml;


      let navHtml = '';

      // Render Custom Pages / Guides Section
      if (filteredPages.length > 0) {
        navHtml += `
          <div class="space-y-1 mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
            <div class="px-2 py-1 text-[11px] font-semibold tracking-wider uppercase text-slate-600 dark:text-slate-300 flex items-center justify-between">
              <span>Overview & Guides</span>
              <span class="text-[10px] text-slate-600 dark:text-slate-300 font-mono font-medium">${filteredPages.length}</span>
            </div>
            <div class="space-y-0.5">
        `;

        for (const page of filteredPages) {
          const isSelected = page.id === state.selectedPageId;
          const activeClass = isSelected
            ? 'bg-blue-50/90 dark:bg-blue-950/50 text-blue-900 dark:text-blue-200 border-l-2 border-blue-600 dark:border-blue-400 font-medium'
            : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800/60 border-l-2 border-transparent';

          navHtml += `
            <button
              data-page-id="${page.id}"
              class="page-nav-item w-full text-left px-2.5 py-1.5 rounded-r-lg transition flex items-center gap-2 group ${activeClass}"
            >
              <div class="w-5 h-5 rounded flex items-center justify-center flex-shrink-0 text-slate-500 dark:text-slate-400 group-hover:text-blue-600 dark:group-hover:text-blue-400">
                <i data-lucide="${page.icon || 'book-open'}" class="w-3.5 h-3.5"></i>
              </div>
              <div class="min-w-0 flex-1">
                <div class="text-xs truncate font-medium">${page.title}</div>
              </div>
            </button>
          `;
        }

        navHtml += `
            </div>
          </div>
        `;
      }

      // Group endpoints by Tag
      const grouped = {};
      for (const ep of filtered) {
        const primaryTag = ep.tags[0] || 'General';
        if (!grouped[primaryTag]) grouped[primaryTag] = [];
        grouped[primaryTag].push(ep);
      }

      if (filtered.length === 0 && filteredPages.length === 0) {
        navEl.innerHTML = `
          <div class="p-6 text-center text-slate-400 dark:text-slate-500">
            <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-60"></i>
            <p class="text-xs font-medium">No results matching</p>
            <p class="text-[11px] font-mono mt-0.5 text-slate-500">"${query}"</p>
            <button id="btn-reset-filter" class="mt-3 text-xs text-blue-600 dark:text-blue-400 hover:underline font-medium">Clear search</button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      for (const [tagName, groupEndpoints] of Object.entries(grouped)) {
        navHtml += `
          <div class="space-y-1">
            <div class="px-2 py-1 text-[11px] font-semibold tracking-wider uppercase text-slate-600 dark:text-slate-300 flex items-center justify-between">
              <span>${tagName}</span>
              <span class="text-[10px] text-slate-600 dark:text-slate-300 font-mono font-medium">${groupEndpoints.length}</span>
            </div>
            <div class="space-y-0.5">
        `;

        // Render x-page before endpoints of the path (deduplicated per tag)
        const renderedPathPagesInTag = new Set();

        for (const ep of groupEndpoints) {
          if (ep.pathPage && !renderedPathPagesInTag.has(ep.pathPage.id)) {
            renderedPathPagesInTag.add(ep.pathPage.id);
            const isSelected = ep.pathPage.id === state.selectedPageId;
            const activeClass = isSelected
              ? 'bg-blue-50/90 dark:bg-blue-950/50 text-blue-900 dark:text-blue-200 border-l-2 border-blue-600 dark:border-blue-400 font-medium'
              : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800/60 border-l-2 border-transparent';

            navHtml += `
              <button
                data-page-id="${ep.pathPage.id}"
                class="page-nav-item w-full text-left px-2.5 py-1.5 rounded-r-lg transition flex items-center gap-2 group ${activeClass}"
                title="${ep.pathPage.title}"
              >
                <div class="w-5 h-5 rounded flex items-center justify-center flex-shrink-0 text-slate-500 dark:text-slate-400 group-hover:text-blue-600 dark:group-hover:text-blue-400">
                  <i data-lucide="${ep.pathPage.icon || 'info'}" class="w-3.5 h-3.5 text-blue-500"></i>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="text-xs truncate font-medium">${ep.pathPage.title}</div>
                </div>
              </button>
            `;
          }
          const isSelected = ep.id === state.selectedEndpointId;
          const activeClass = isSelected
            ? 'bg-blue-50/90 dark:bg-blue-950/50 text-blue-900 dark:text-blue-200 border-l-2 border-blue-600 dark:border-blue-400 font-medium'
            : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800/60 border-l-2 border-transparent';

          navHtml += `
            <button
              data-endpoint-id="${ep.id}"
              class="endpoint-nav-item w-full text-left px-2.5 py-1.5 rounded-r-lg transition flex items-center gap-2 group ${activeClass}"
            >
              ${getMethodBadgeHtml(ep.method, 'sm')}
              <div class="min-w-0 flex-1">
                <div class="text-xs truncate font-medium">${ep.summary || ep.path}</div>
                <div class="text-[10px] font-mono text-slate-600 dark:text-slate-400 truncate opacity-80 group-hover:opacity-100">${ep.path}</div>
              </div>
            </button>
          `;
        }

        navHtml += `
            </div>
          </div>
        `;
      }

      navEl.innerHTML = navHtml;
      lucide.createIcons();
    }

    function renderDetails() {
      const viewEl = document.getElementById('endpoint-details-view');
      if (!viewEl || !state.parsedSpec) return;

      // Check if a custom documentation page is currently selected
      if (state.selectedPageId) {
        const page = getSelectedPage();
        if (page) {
          viewEl.innerHTML = `
            <div class="space-y-6 sm:space-y-8 w-full min-w-0">
              <div class="border-b border-slate-200 dark:border-slate-800 pb-6 space-y-3">
                <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800/80">
                  <i data-lucide="${page.icon || 'book-open'}" class="w-3.5 h-3.5"></i>
                  <span>Documentation</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white break-words">
                  ${page.title}
                </h1>
              </div>

              <!-- Page Markdown / HTML Content -->
              <div class="page-content-wrapper leading-relaxed text-slate-700 dark:text-slate-300">
                ${renderMarkdown(page.content)}
              </div>
            </div>
          `;
          lucide.createIcons();
          return;
        }
      }

      const endpoint = getSelectedEndpoint();
      if (!endpoint) return;

      const { baseUrl } = state.parsedSpec;

      // Colorize path segments like {petId}
      const formattedPath = endpoint.path.replace(/\{([^}]+)\}/g, '<span class="text-blue-600 dark:text-blue-400 font-semibold">{$1}</span>');

      let html = `
        <!-- Endpoint Header -->
        <div class="border-b border-slate-200 dark:border-slate-800 pb-6 space-y-3 w-full min-w-0">
          <div class="flex flex-wrap items-center gap-2 min-w-0">
            ${getMethodBadgeHtml(endpoint.method, 'lg')}
            <code class="text-xs sm:text-sm font-mono font-medium text-slate-800 dark:text-slate-200 bg-slate-100 dark:bg-slate-800/80 px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700 select-all break-all max-w-full">
              ${formattedPath}
            </code>
            <button id="btn-copy-path" class="p-1 rounded text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition flex-shrink-0" title="Copy Path URL">
              <i data-lucide="copy" class="w-4 h-4"></i>
            </button>
          </div>

          <h2 class="text-lg sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white break-words">
            ${endpoint.summary}
          </h2>

          <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-slate-500 break-words">
            <span class="inline-flex items-center gap-1 font-mono text-slate-400 break-all">
              <i data-lucide="server" class="w-3.5 h-3.5 flex-shrink-0"></i>
              <span>${baseUrl}</span>
            </span>
            ${endpoint.operationId ? `<span>•</span><span class="font-mono text-slate-400 break-all">operationId: <span class="text-slate-600 dark:text-slate-300 font-medium">${endpoint.operationId}</span></span>` : ''}
          </div>

          <!-- Markdown Description -->
          ${endpoint.description ? `<div class="mt-3 pt-2 text-slate-600 dark:text-slate-400 leading-relaxed text-xs sm:text-sm break-words">${renderMarkdown(endpoint.description)}</div>` : ''}
        </div>

        <!-- Parameters Section -->
        <div class="space-y-4 w-full min-w-0">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-slate-100 flex items-center gap-2">
              <i data-lucide="sliders" class="w-4 h-4 text-slate-400"></i>
              <span>Parameters</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">${endpoint.parameters.length}</span>
            </h3>
          </div>

          ${renderParametersTable(endpoint.parameters)}
        </div>

        <!-- Request Body Section -->
        <div id="request-body-section" class="space-y-4 w-full min-w-0">
          <!-- Rendered by renderRequestBodySection() -->
        </div>

        <!-- Responses Section -->
        <div id="responses-section" class="space-y-4 w-full min-w-0">
          <!-- Rendered by renderResponsesSection() -->
        </div>
      `;

      viewEl.innerHTML = html;
      renderRequestBodySection();
      renderResponsesSection();
      lucide.createIcons();
    }

    function renderParametersTable(parameters) {
      if (!parameters || parameters.length === 0) {
        return `
          <div class="bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-xl p-4 text-center text-xs text-slate-500 dark:text-slate-400 w-full">
            No parameters required for this endpoint.
          </div>
        `;
      }

      let rows = '';
      for (const p of parameters) {
        const requiredBadge = p.required
          ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-400 border border-rose-200 dark:border-rose-900/60">Required</span>`
          : `<span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700">Optional</span>`;

        let inBadgeClass = 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400';
        if (p.in === 'path') inBadgeClass = 'bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-900';
        if (p.in === 'header') inBadgeClass = 'bg-purple-50 text-purple-700 border-purple-200 dark:bg-purple-950/60 dark:text-purple-300 dark:border-purple-900';

        rows += `
          <tr class="border-b border-slate-100 dark:border-slate-800/80 hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition text-xs">
            <td class="py-3 px-3.5 align-top">
              <div class="font-mono font-semibold text-slate-900 dark:text-slate-100 break-all">${p.name}</div>
              <div class="mt-1 flex items-center gap-1.5 flex-wrap">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-mono border ${inBadgeClass}">${p.in}</span>
                ${requiredBadge}
              </div>
            </td>
            <td class="py-3 px-3.5 align-top font-mono text-slate-600 dark:text-slate-300 break-all">
              <div>${p.type}${p.format ? ` (${p.format})` : ''}</div>
              ${p.enum ? `<div class="text-[11px] text-amber-600 dark:text-amber-400 mt-1 break-words">enum: [${p.enum.join(', ')}]</div>` : ''}
              ${p.default !== undefined ? `<div class="text-[11px] text-slate-400 mt-0.5 break-all">default: ${JSON.stringify(p.default)}</div>` : ''}
            </td>
            <td class="py-3 px-3.5 align-top text-slate-600 dark:text-slate-400 leading-relaxed break-words">
              <div>${p.description || '<span class="italic text-slate-400">No description provided</span>'}</div>
              ${p.examples && p.examples.length > 1 ? `
                <div class="mt-1.5 space-y-1">
                  <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Examples (${p.examples.length}):</div>
                  <div class="flex flex-wrap gap-1">
                    ${p.examples.map(ex => `<span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 break-all" title="${escapeHtml(ex.summary || ex.key)}"><strong class="font-semibold text-slate-800 dark:text-slate-200">${escapeHtml(ex.key)}</strong>: ${escapeHtml(JSON.stringify(ex.value))}</span>`).join('')}
                  </div>
                </div>
              ` : (p.example !== undefined ? `<div class="mt-1 font-mono text-[11px] text-slate-500 break-all">example: <code class="bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">${JSON.stringify(p.example)}</code></div>` : '')}
            </td>
          </tr>
        `;
      }

      return `
        <div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-sm bg-white dark:bg-slate-900 w-full max-w-full">
          <div class="overflow-x-auto w-full max-w-full">
            <table class="w-full text-left border-collapse min-w-[480px] sm:min-w-full">
              <thead>
                <tr class="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  <th class="py-2.5 px-3.5 w-1/4">Parameter</th>
                  <th class="py-2.5 px-3.5 w-1/4">Type</th>
                  <th class="py-2.5 px-3.5 w-1/2">Description</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderRequestBodySection() {
      const container = document.getElementById('request-body-section');
      const endpoint = getSelectedEndpoint();
      if (!container || !endpoint) return;

      if (!endpoint.requestBody) {
        container.innerHTML = '';
        return;
      }

      const rb = endpoint.requestBody;
      const isExampleTab = state.activeRequestBodyTab === 'example';
      const examples = rb.examples || [];
      const hasMultipleExamples = examples.length > 1;

      const activeEx = (examples.length > 0)
        ? (examples.find(e => e.key === state.activeRequestBodyExampleKey) || examples[0])
        : { key: 'default', name: 'Example', value: rb.exampleData || {} };

      state.activeRequestBodyExampleKey = activeEx.key;
      const exampleJson = activeEx.value !== undefined ? JSON.stringify(activeEx.value, null, 2) : '{}';

      let contentHtml = '';
      if (isExampleTab) {
        let examplesToolbarHtml = '';
        if (hasMultipleExamples) {
          const optionsHtml = examples.map(ex => {
            const isSel = ex.key === activeEx.key ? 'selected' : '';
            const label = ex.summary ? `${ex.key} — ${ex.summary}` : ex.name || ex.key;
            return `<option value="${escapeHtml(ex.key)}" ${isSel}>${escapeHtml(label)}</option>`;
          }).join('');

          const pillsHtml = examples.map(ex => {
            const isSel = ex.key === activeEx.key;
            const pillCls = isSel
              ? 'bg-blue-600 text-white shadow-sm'
              : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700';
            return `
              <button
                type="button"
                data-rb-example-key="${escapeHtml(ex.key)}"
                class="rb-example-pill px-2.5 py-1 rounded-md text-xs font-mono font-medium transition flex-shrink-0 ${pillCls}"
                title="${escapeHtml(ex.summary || ex.key)}"
              >
                ${escapeHtml(ex.key)}
              </button>
            `;
          }).join('');

          examplesToolbarHtml = `
            <div class="mb-3 space-y-2 w-full min-w-0">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-50 dark:bg-slate-900/90 p-2 sm:p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 w-full min-w-0">
                <div class="flex items-center gap-2 min-w-0 flex-1 w-full">
                  <span class="text-xs font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1.5 flex-shrink-0">
                    <i data-lucide="layers" class="w-3.5 h-3.5 text-blue-500"></i>
                    <span>Example:</span>
                  </span>
                  <select
                    id="select-rb-example"
                    class="text-xs bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg px-2 sm:px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium cursor-pointer w-full min-w-0 truncate shadow-sm flex-1"
                  >
                    ${optionsHtml}
                  </select>
                </div>
                <span class="text-[11px] font-mono text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded bg-slate-200/60 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 self-start sm:self-auto flex-shrink-0">
                  ${examples.length} examples
                </span>
              </div>

              <!-- Pill selector list for quick clicks: Only on sm+ screens, hidden on mobile -->
              <div class="hidden sm:flex items-center gap-1.5 overflow-x-auto pb-1 max-w-full">
                ${pillsHtml}
              </div>

              ${(activeEx.summary || activeEx.description) ? `
                <div class="px-3 py-2 bg-blue-50/70 dark:bg-blue-950/40 border border-blue-200/70 dark:border-blue-900/60 rounded-lg text-xs space-y-0.5 w-full min-w-0 break-words">
                  ${activeEx.summary ? `<div class="font-semibold text-blue-900 dark:text-blue-300 flex items-center gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5 flex-shrink-0 text-blue-500"></i><span>${escapeHtml(activeEx.summary)}</span></div>` : ''}
                  ${activeEx.description ? `<div class="text-slate-600 dark:text-slate-400 pl-5 break-words">${renderMarkdown(activeEx.description)}</div>` : ''}
                </div>
              ` : ''}
            </div>
          `;
        } else if (activeEx.summary || activeEx.description) {
          examplesToolbarHtml = `
            <div class="mb-3 px-3 py-2 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-lg text-xs space-y-0.5 w-full min-w-0 break-words">
              ${activeEx.summary ? `<div class="font-medium text-slate-800 dark:text-slate-200">${escapeHtml(activeEx.summary)}</div>` : ''}
              ${activeEx.description ? `<div class="text-slate-500 dark:text-slate-400">${escapeHtml(activeEx.description)}</div>` : ''}
            </div>
          `;
        }

        contentHtml = `
          ${examplesToolbarHtml}
          <div class="relative w-full max-w-full">
            <pre class="bg-slate-900 text-slate-100 rounded-xl overflow-x-auto shadow-inner p-3 sm:p-4 w-full max-w-full"><code id="rb-example-code" class="language-json block w-full whitespace-pre">${highlightCode(exampleJson, 'json')}</code></pre>
            <button
              id="btn-copy-rb-example"
              class="absolute top-3 right-3 px-2 py-1 text-[11px] font-medium rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition flex items-center gap-1 shadow-sm"
              title="Copy JSON Payload"
            >
              <i data-lucide="copy" class="w-3 h-3"></i>
              <span>Copy</span>
            </button>
          </div>
        `;
      } else {
        // Schema table
        const properties = flattenSchemaProperties(rb.schema);
        if (properties.length === 0) {
          contentHtml = `<div class="p-4 text-xs text-slate-500 w-full">No schema details available.</div>`;
        } else {
          let rows = '';
          for (const p of properties) {
            rows += `
              <tr class="border-b border-slate-100 dark:border-slate-800/80 text-xs">
                <td class="py-2.5 px-3 font-mono font-medium text-slate-800 dark:text-slate-200 break-all">
                  ${p.name}
                  ${p.required ? `<span class="text-rose-500 ml-0.5">*</span>` : ''}
                </td>
                <td class="py-2.5 px-3 font-mono text-slate-600 dark:text-slate-400 break-all">${p.type}</td>
                <td class="py-2.5 px-3 text-slate-600 dark:text-slate-400 break-words">
                  <div>${p.description || '-'}</div>
                  ${p.enum ? `<div class="text-[11px] text-amber-600 dark:text-amber-400 mt-0.5 break-words">enum: [${p.enum}]</div>` : ''}
                  ${p.example ? `<div class="text-[11px] font-mono text-slate-400 mt-0.5 break-all">example: ${p.example}</div>` : ''}
                </td>
              </tr>
            `;
          }
          contentHtml = `
            <div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden w-full max-w-full">
              <div class="overflow-x-auto w-full max-w-full">
                <table class="w-full text-left border-collapse text-xs min-w-[400px] sm:min-w-full">
                  <thead>
                    <tr class="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 text-[11px] font-semibold uppercase text-slate-500">
                      <th class="py-2 px-3">Field</th>
                      <th class="py-2 px-3">Type</th>
                      <th class="py-2 px-3">Description</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          `;
        }
      }

      container.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 dark:border-slate-800 pt-6 w-full min-w-0">
          <h3 class="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-slate-100 flex items-center gap-2">
            <i data-lucide="file-code" class="w-4 h-4 text-slate-400"></i>
            <span>Request Body</span>
            ${rb.required ? `<span class="text-[10px] px-1.5 py-0.5 rounded font-semibold bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-400 border border-rose-200 dark:border-rose-900">Required</span>` : ''}
          </h3>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 truncate max-w-[150px]">
              ${rb.contentType}
            </span>
            <div class="flex rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5 text-xs">
              <button
                id="btn-rb-tab-example"
                class="px-2.5 py-1 rounded-md transition font-medium ${isExampleTab ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}"

    function isPlainObject(val) {
      return val !== null && typeof val === 'object' && !Array.isArray(val);
    }

    function flattenObjectForTable(obj, prefix = '', depth = 0, maxDepth = 2) {
      const out = {};
      if (!isPlainObject(obj)) return out;
      for (const [k, v] of Object.entries(obj)) {
        const key = prefix ? `${prefix}.${k}` : k;
        if (isPlainObject(v) && depth < maxDepth && Object.keys(v).length > 0) {
          Object.assign(out, flattenObjectForTable(v, key, depth + 1, maxDepth));
        } else {
          out[key] = v;
        }
      }
      return out;
    }

    function extractTableDataset(body) {
      if (body === null || body === undefined || typeof body !== 'object') {
        return { mode: 'unsupported', reason: 'Table view is only available for JSON object or array responses.' };
      }

      if (Array.isArray(body)) {
        if (body.length === 0) {
          return { mode: 'empty', meta: null, columns: [], rows: [], sourceLabel: 'Array (0 rows)' };
        }
        const hasObjects = body.some(item => isPlainObject(item));
        const normalizedRows = hasObjects
          ? body.map(item => isPlainObject(item) ? flattenObjectForTable(item) : { value: item })
          : body.map((item, idx) => ({ '#': idx + 1, value: item }));
        const colSet = new Set();
        normalizedRows.forEach(r => Object.keys(r).forEach(k => colSet.add(k)));
        return {
          mode: 'array',
          meta: null,
          columns: [...colSet],
          rows: normalizedRows,
          sourceLabel: `Array (${normalizedRows.length} rows)`
        };
      }

      // Plain object: detect wrapped array (e.g. { data: [...], meta: {...} })
      const priorityKeys = ['data', 'items', 'results', 'records', 'rows', 'list', 'entries'];
      let targetKey = null;

      for (const pk of priorityKeys) {
        if (Array.isArray(body[pk]) && (body[pk].length === 0 || body[pk].some(item => isPlainObject(item)))) {
          targetKey = pk;
          break;
        }
      }
      if (!targetKey) {
        for (const [k, v] of Object.entries(body)) {
          if (Array.isArray(v) && v.length > 0 && v.some(item => isPlainObject(item))) {
            targetKey = k;
            break;
          }
        }
      }

      if (targetKey) {
        const arr = body[targetKey];
        const metaEntries = {};
        for (const [k, v] of Object.entries(body)) {
          if (k !== targetKey) metaEntries[k] = v;
        }
        const meta = Object.keys(metaEntries).length > 0 ? flattenObjectForTable(metaEntries, '', 0, 1) : null;
        if (arr.length === 0) {
          return { mode: 'empty', meta, columns: [], rows: [], sourceLabel: `${targetKey} (0 rows)` };
        }
        const normalizedRows = arr.map(item => isPlainObject(item) ? flattenObjectForTable(item) : { value: item });
        const colSet = new Set();
        normalizedRows.forEach(r => Object.keys(r).forEach(k => colSet.add(k)));
        return {
          mode: 'array',
          meta,
          columns: [...colSet],
          rows: normalizedRows,
          sourceLabel: `${targetKey} (${normalizedRows.length} rows)`
        };
      }

      // Fallback: single object -> Key / Value table
      const flat = flattenObjectForTable(body, '', 0, 2);
      const kvRows = Object.entries(flat).map(([k, v]) => ({ Key: k, Value: v }));
      return {
        mode: 'keyvalue',
        meta: null,
        columns: ['Key', 'Value'],
        rows: kvRows,
        sourceLabel: `Object (${kvRows.length} fields)`
      };
    }

    function formatCellCopyValue(val) {
      if (val === undefined || val === null) return '';
      if (typeof val === 'object') return JSON.stringify(val, null, 2);

    let currentTableNestedValues = [];

    function getActiveTableBody() {
      const stack = state.liveResponseTableStack || [];
      if (stack.length > 0) {
        return stack[stack.length - 1].data;
      }
      return state.tryRequestState?.body;
    }

    function openNestedTable(nestedIdx) {
      const entry = currentTableNestedValues[nestedIdx];
      if (!entry) return;
      state.liveResponseTableStack.push({
        label: entry.col,
        data: entry.val,
        prevFilter: state.liveResponseFilter,
        prevSortCol: state.liveResponseSortCol,
        prevSortDir: state.liveResponseSortDir
      });
      state.liveResponseFilter = '';
      state.liveResponseSortCol = null;
      state.liveResponseSortDir = null;
      renderLiveResponseOutput();
    }

    function closeNestedTable(targetDepth = 0) {
      const stack = state.liveResponseTableStack || [];
      if (stack.length === 0) return;
      if (targetDepth <= 0) {
        const rootSaved = stack[0];
        state.liveResponseFilter = rootSaved.prevFilter || '';
        state.liveResponseSortCol = rootSaved.prevSortCol || null;
        state.liveResponseSortDir = rootSaved.prevSortDir || null;
        state.liveResponseTableStack = [];
      } else if (targetDepth < stack.length) {
        const restored = stack[targetDepth];
        state.liveResponseFilter = restored.prevFilter || '';
        state.liveResponseSortCol = restored.prevSortCol || null;
        state.liveResponseSortDir = restored.prevSortDir || null;
        state.liveResponseTableStack = stack.slice(0, targetDepth);
      }
      renderLiveResponseOutput();
    }

    function formatTableCellHtml(val, nestedIdx = null) {
      if (val === undefined) {
        return '<span class="text-slate-600 italic">—</span>';
      }
      if (val === null) {
        return '<span class="text-slate-500 italic font-mono text-[11px]">null</span>';
      }
      if (typeof val === 'boolean') {
        const cls = val
          ? 'bg-emerald-950/70 text-emerald-300 border-emerald-800'
          : 'bg-rose-950/70 text-rose-300 border-rose-800';
        return `<span class="inline-flex px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold border ${cls}">${val}</span>`;
      }
      if (typeof val === 'number') {
        return `<span class="font-mono text-amber-300">${escapeHtml(String(val))}</span>`;
      }
      if (typeof val === 'object') {
        const preview = JSON.stringify(val);
        const shortPreview = preview.length > 160 ? preview.slice(0, 157) + '...' : preview;
        const badge = Array.isArray(val)
          ? `[${val.length} items]`
          : `{${Object.keys(val).length} keys}`;
        const idxAttr = nestedIdx !== null ? `data-nested-idx="${nestedIdx}"` : '';
        return `<button type="button" ${idxAttr} class="try-table-nested-btn inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-mono bg-blue-950/70 hover:bg-blue-900/80 text-blue-300 hover:text-white border border-blue-800/80 transition cursor-pointer" title="Open nested table: ${escapeHtml(shortPreview)}"><span>${escapeHtml(badge)}</span><span class="text-blue-400">↗</span></button>`;
      }
      const str = String(val);
      const isUrl = /^https?:\/\//i.test(str);
      const cls = isUrl ? 'text-sky-300' : 'text-slate-200';
      return `<span class="${cls} break-words">${escapeHtml(str)}</span>`;
    }

    function filterTableRows(rows, columns, query) {
      const q = (query || '').trim().toLowerCase();
      if (!q) return rows;
      return rows.filter(row =>
        columns.some(col => {
          const v = row[col];
          if (v === undefined || v === null) return 'null'.includes(q);
          const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
          return s.toLowerCase().includes(q);
        })
      );
    }

    function sortTableRows(rows, sortCol, sortDir) {
      if (!sortCol || !sortDir) return rows;
      const factor = sortDir === 'desc' ? -1 : 1;
      const toComparable = (v) => {
        if (v === undefined || v === null) return null;
        if (typeof v === 'number') return { kind: 'num', val: v };
        if (typeof v === 'boolean') return { kind: 'num', val: v ? 1 : 0 };
        if (typeof v === 'object') return { kind: 'str', val: JSON.stringify(v) };
        return { kind: 'str', val: String(v) };
      };
      return [...rows].sort((rowA, rowB) => {
        const a = toComparable(rowA[sortCol]);
        const b = toComparable(rowB[sortCol]);
        if (a === null && b === null) return 0;
        if (a === null) return 1;  // Always place null/undefined last
        if (b === null) return -1;
        if (a.kind === 'num' && b.kind === 'num') {
          if (a.val < b.val) return -1 * factor;
          if (a.val > b.val) return 1 * factor;
          return 0;
        }
        return String(a.val).localeCompare(String(b.val), undefined, { numeric: true, sensitivity: 'base' }) * factor;
      });
    }

    function getFilteredAndSortedRows(dataset) {
      const filtered = filterTableRows(dataset.rows, dataset.columns, state.liveResponseFilter);
      const validSortCol = state.liveResponseSortCol && dataset.columns.includes(state.liveResponseSortCol)
        ? state.liveResponseSortCol
        : null;
      return sortTableRows(filtered, validSortCol, state.liveResponseSortDir);
    }

    function buildTableHeaderHtml(columns) {
      return columns.map(col => {
        const isSorted = state.liveResponseSortCol === col && state.liveResponseSortDir;
        const dir = isSorted ? state.liveResponseSortDir : null;
        const thColor = dir ? 'text-blue-400 bg-slate-900/90' : 'text-slate-300 bg-slate-950';
        let iconSvg = '';
        if (dir === 'asc') {
          iconSvg = '<svg class="w-3 h-3 text-blue-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>';
        } else if (dir === 'desc') {
          iconSvg = '<svg class="w-3 h-3 text-blue-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
        } else {
          iconSvg = '<svg class="w-3 h-3 text-slate-600 group-hover:text-slate-400 flex-shrink-0 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>';
        }
        const ariaSort = dir === 'asc' ? 'ascending' : (dir === 'desc' ? 'descending' : 'none');
        return `<th class="try-table-sort-th group px-2.5 py-2 text-left text-[11px] font-mono font-semibold ${thColor} border-b border-slate-800 whitespace-nowrap cursor-pointer select-none hover:bg-slate-900 hover:text-white transition-colors" data-sort-col="${escapeHtml(col)}" aria-sort="${ariaSort}" title="Click to sort by ${escapeHtml(col)}"><div class="inline-flex items-center gap-1.5"><span>${escapeHtml(col)}</span>${iconSvg}</div></th>`;
      }).join('');
    }

    function buildTableRowsHtml(rows, columns) {
      currentTableNestedValues = [];
      if (rows.length === 0) {
        return `<tr><td colspan="${Math.max(columns.length, 1)}" class="px-3 py-6 text-center text-xs text-slate-500 italic">No matching rows</td></tr>`;
      }
      const isKvTable = columns.length === 2 && columns[0] === 'Key';
      return rows.map((row, rIdx) => {
        const cells = columns.map((col, cIdx) => {
          const val = row[col];
          const isNestedObj = val !== null && typeof val === 'object';
          let nestedIdx = null;
          let nestedLabel = col;
          if (isNestedObj) {
            if (isKvTable && row.Key) {
              nestedLabel = String(row.Key);
            }
            nestedIdx = currentTableNestedValues.length;
            currentTableNestedValues.push({ col: nestedLabel, val });
          }
          const copyRaw = formatCellCopyValue(val);
          const isKeyCol = isKvTable && cIdx === 0;
          const cellTextCls = isKeyCol ? 'font-mono text-emerald-300 whitespace-nowrap' : 'max-w-[260px]';
          if (isNestedObj) {
            return `<td class="try-table-cell px-2.5 py-1.5 border-b border-slate-800/80 align-top ${cellTextCls} cursor-pointer hover:bg-slate-800/80 transition-colors" data-nested-idx="${nestedIdx}" title="Click to view nested data as table">${formatTableCellHtml(val, nestedIdx)}</td>`;
          }
          return `<td class="try-table-cell px-2.5 py-1.5 border-b border-slate-800/80 align-top ${cellTextCls} cursor-pointer hover:bg-slate-800/80 transition-colors" data-copy-value="${escapeHtml(copyRaw)}" title="Click to copy value">${formatTableCellHtml(val)}</td>`;
        }).join('');
        return `<tr class="${rIdx % 2 === 1 ? 'bg-slate-900/40' : 'bg-slate-950/40'} hover:bg-slate-800/50 transition-colors">${cells}</tr>`;
      }).join('');
    }

    function datasetToCsv(columns, rows) {
      const escCsv = (val) => {
        const s = val === undefined || val === null
          ? ''
          : (typeof val === 'object' ? JSON.stringify(val) : String(val));
        return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      };
      const header = columns.map(escCsv).join(',');
      const lines = rows.map(r => columns.map(c => escCsv(r[c])).join(','));
      return [header, ...lines].join('\n');
    }

    function buildNestedHeaderBarHtml() {

        }
