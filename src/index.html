      background: transparent;
    }

      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.7);
    }

      background: rgba(71, 85, 105, 0.5);
    }
    .dark ::-webkit-scrollbar-thumb:hover {

    }

      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace !important;
      font-size: 0.825rem;
      line-height: 1.6;
      background: transparent !important;
      tab-size: 2;

    .hljs-comment, .token-comment { color: #7f848e !important; font-style: italic; }
    .hljs-keyword, .token-keyword { color: #c678dd !important; font-weight: 600; }
    .hljs-string, .token-string { color: #98c379 !important; }
    .hljs-number, .token-number { color: #d19a66 !important; }
    .hljs-literal, .hljs-boolean, .token-boolean, .token-null { color: #56b6c2 !important; font-weight: 600; }
    .hljs-function, .hljs-title, .hljs-title.function_, .token-function { color: #61afef !important; font-weight: 600; }
    .hljs-built_in, .token-builtin { color: #e5c07b !important; }
    .hljs-attr, .token-key { color: #e06c75 !important; }
    .hljs-params { color: #e5c07b !important; }
    .hljs-variable { color: #e06c75 !important; }

  <script>
    'use strict';

    /**
     * ============================================================================
     * 1. EMBEDDED SPECIFICATION
     * ============================================================================
     */
    // __EMBEDDED_SPEC_START__
    const EMBEDDED_OPENAPI_SPEC = null;
    // __EMBEDDED_SPEC_END__
    // __EMBEDDED_SERVER_URL_START__
    const EMBEDDED_SERVER_URL = null;
    // __EMBEDDED_SERVER_URL_END__
    /**
     * ============================================================================
     * 2. SPEC RESOLUTION & DEREFERENCING HELPERS
     * ============================================================================
     */
    function resolveJsonPointer(root, ref) {
      if (!ref || typeof ref !== 'string' || !ref.startsWith('#/')) {
        return null;
      }
      const parts = ref.substring(2).split('/').map(p => p.replace(/~1/g, '/').replace(/~0/g, '~'));
      let curr = root;
      for (const part of parts) {
        if (curr && typeof curr === 'object' && part in curr) {
          curr = curr[part];
        } else {
          return null;
        }
      }
      return curr;
    }

    function dereferenceSchema(root, schema, depth = 0, visited = new Set()) {
      if (!schema || typeof schema !== 'object' || depth > 12) return schema;

      if (schema.$ref) {
        if (visited.has(schema.$ref)) {
          return { type: 'object', description: `[Circular: ${schema.$ref}]` };
        }
        const nextVisited = new Set(visited);
        nextVisited.add(schema.$ref);
        const resolved = resolveJsonPointer(root, schema.$ref);
        if (resolved) {
          const { $ref, ...rest } = schema;
          const merged = { ...resolved, ...rest };
          return dereferenceSchema(root, merged, depth + 1, nextVisited);
        }
        return schema;
      }

      if (schema.allOf && Array.isArray(schema.allOf)) {
        const merged = {};
        for (const sub of schema.allOf) {
          const derefSub = dereferenceSchema(root, sub, depth + 1, visited);
          if (derefSub && typeof derefSub === 'object') {
            Object.assign(merged, derefSub);
            if (derefSub.properties) {
              merged.properties = Object.assign({}, merged.properties || {}, derefSub.properties);

            if (derefSub.required) {

      if (schema.oneOf && Array.isArray(schema.oneOf) && schema.oneOf.length > 0) {

      }
      if (schema.anyOf && Array.isArray(schema.anyOf) && schema.anyOf.length > 0) {
        return dereferenceSchema(root, schema.anyOf[0], depth + 1, visited);
      }

      const result = Array.isArray(schema) ? [] : {};
      for (const [key, val] of Object.entries(schema)) {
        if (val && typeof val === 'object') {
          result[key] = dereferenceSchema(root, val, depth + 1, visited);
        } else {
          result[key] = val;
        }
      }
      return result;
    }

    /**

      if (schema.default !== undefined) return schema.default;
      if (schema.examples && Array.isArray(schema.examples) && schema.examples.length > 0) return schema.examples[0];
      if (schema.enum && schema.enum.length > 0) return schema.enum[0];

      const type = schema.type || (schema.properties ? 'object' : (schema.items ? 'array' : 'string'));

      switch (type) {
        case 'string':
          if (schema.format === 'date-time') return '2026-09-30T14:20:00.000Z';
          if (schema.format === 'date') return '2026-09-30';
          if (schema.format === 'email') return 'user@example.com';
          if (schema.format === 'uri' || schema.format === 'url') return 'https://images.unsplash.com/photo-1552053831-71594a27632d';
          if (schema.format === 'uuid') return 'a81d432e-b4a1-4fc6-b72e-0f8a92bc13d8';
          if (schema.format === 'password') return '********';
          if (propName.toLowerCase().includes('email')) return 'user@example.com';
          if (propName.toLowerCase().includes('name')) return 'Apollo';
          if (propName.toLowerCase().includes('status')) return 'available';
          if (propName.toLowerCase().includes('id')) return 'usr_9824';
          return 'sample_string';

        case 'integer':
          if (propName.toLowerCase().includes('id')) return 42;
          if (propName.toLowerCase().includes('code')) return 200;
          if (propName.toLowerCase().includes('count') || propName.toLowerCase().includes('qty') || propName.toLowerCase().includes('quantity')) return 1;
          return 10;

        case 'number':
          return 29.99;

        case 'boolean':
          return true;

        case 'array':
          if (schema.items) {
            return [generateMockFromSchema(schema.items, propName, depth + 1)];
          }
          return [];

        case 'object':
          if (schema.properties) {
            const obj = {};
            for (const [k, p] of Object.entries(schema.properties)) {
              obj[k] = generateMockFromSchema(p, k, depth + 1);

          }
          return {};

    /**
     * Flattens a nested schema into readable rows for parameter tables

    function flattenSchemaProperties(schema, prefix = '') {

        for (const [key, prop] of Object.entries(schema.properties)) {
          const isReq = requiredSet.has(key);
          const fullName = prefix ? `${prefix}.${key}` : key;
          const type = prop.type || (prop.properties ? 'object' : (prop.items ? 'array' : 'any'));
          const format = prop.format ? ` (${prop.format})` : '';
          const itemsType = prop.items ? `[${prop.items.type || (prop.items.properties ? 'object' : 'any')}]` : '';

          rows.push({
            name: fullName,
            required: isReq,
            type: `${type}${itemsType}${format}`,
            description: prop.description || '',
            example: prop.example !== undefined ? JSON.stringify(prop.example) : '',
            enum: prop.enum ? prop.enum.join(', ') : '',
            default: prop.default !== undefined ? JSON.stringify(prop.default) : ''
          });

          if (prop.properties) {
            rows.push(...flattenSchemaProperties(prop, fullName));
          } else if (prop.items && prop.items.properties) {
            rows.push(...flattenSchemaProperties(prop.items, `${fullName}[]`));
          }
        }
      } else if (schema.type === 'array' && schema.items) {
        if (schema.items.properties) {
          rows.push(...flattenSchemaProperties(schema.items, 'item'));
        } else {
          rows.push({
            name: 'item',
            required: true,
            type: schema.items.type || 'any',
            description: schema.items.description || '',
            example: schema.items.example !== undefined ? JSON.stringify(schema.items.example) : '',
            enum: schema.items.enum ? schema.items.enum.join(', ') : '',
            default: ''
          });
        }
      }

      return rows;
    }

          } else if (typeof ex === 'object' && ex !== null && !('summary' in ex) && !('description' in ex) && !('$ref' in ex)) {
            val = ex;

            name: ex.summary || key,
            summary: ex.summary || '',
            description: ex.description || '',

          summary: '',
          description: '',

              name: `Example ${idx + 1}`,
              summary: '',
              description: '',
              value: item
            });
          });

          for (const [key, rawEx] of Object.entries(schema.examples)) {
            const val = rawEx && typeof rawEx === 'object' && rawEx.value !== undefined ? rawEx.value : rawEx;
            list.push({
              key,
              name: (rawEx && rawEx.summary) || key,
              summary: (rawEx && rawEx.summary) || '',
              description: (rawEx && rawEx.description) || '',
              value: val

        }
      }

      // 4. Check schema.example
      if (list.length === 0 && schema && schema.example !== undefined) {
        list.push({
          key: 'default',
          name: 'Default Schema Example',
          summary: '',
          description: '',
          value: schema.example
        });
      }

      if (list.length === 0 && schema) {
        const mock = generateMockFromSchema(schema);
        if (mock !== null && mock !== undefined) {
          list.push({
            key: 'default',
            name: 'Schema Template',
            summary: 'Generated from schema definition',
            description: '',
            value: mock
          });
        }
      }

      return list;
    }

          const endpointId = `${method.toLowerCase()}-${pathStr.replace(/[^a-zA-Z0-9_-]/g, '_')}`;

                  required: !!p.required,
                  contentType: (op.consumes && op.consumes[0]) || 'application/json',

                  examples,
                  exampleData
                };
              } else {
                const paramSchema = p.schema ? dereferenceSchema(raw, p.schema) : {
                  type: p.type || 'string',
                  format: p.format,
                  enum: p.enum,
                  default: p.default,
                  items: p.items
                };
                normalizedParams.push({
                  name: p.name,
                  in: p.in || 'query',
                  description: p.description || '',
                  required: !!p.required,
                  type: p.type ? (p.type + (p.items ? `[${p.items.type || 'object'}]` : '')) : 'string',
                  format: p.format || '',
                  enum: p.enum || null,
                  default: p.default,
                  example: p['x-example'] ?? p.default,
                  examples: [],
                  schema: paramSchema

          const normalizedResponses = [];
          const responsesObj = op.responses || {};

            if (!respVal) continue;

            let examples = [];
            let exampleData = null;
            let contentType = 'application/json';

              const content = resp.content || {};
              const firstCt = Object.keys(content)[0];
              if (firstCt) {
                contentType = firstCt;
                const media = content[firstCt] || {};
                schema = media.schema ? dereferenceSchema(raw, media.schema) : null;
                const combinedMediaObj = {
                  example: media.example ?? resp.example,
                  examples: media.examples || resp.examples

              schema,
              examples,
              exampleData

          normalizedResponses.sort((a, b) => {
            if (a.statusCode === 'default') return 1;
            if (b.statusCode === 'default') return -1;
            return a.statusCode.localeCompare(b.statusCode);
          });

          const tags = (op.tags && Array.isArray(op.tags) && op.tags.length > 0) ? op.tags : ['General'];

          endpoints.push({
            id: endpointId,
            method: method.toUpperCase(),
            path: pathStr,
            summary: op.summary || `${method.toUpperCase()} ${pathStr}`,
            description: op.description || '',
            operationId: op.operationId || '',
            tags,
            parameters: normalizedParams,
            requestBody,
            responses: normalizedResponses
          });
        }
      }

      // Unique tags extraction
      const tagsMap = new Map();
      if (Array.isArray(raw.tags)) {
        for (const t of raw.tags) {
          if (t && t.name) {

          }
        }
      }
      for (const ep of endpoints) {
        for (const tag of ep.tags) {
          if (!tagsMap.has(tag)) {

        }
      }

      const rawPages = raw['x-pages'] || (raw.info && raw.info['x-pages']) || [];
      const pages = [];

            id: pageId,
            title: p.title || p.name || `Page ${i + 1}`,

        info,
        baseUrl,
        endpoints,
        tags: Array.from(tagsMap.values()),
        pages

    function generateFetchCode(endpoint, baseUrl, liveParamValues = {}, liveBodyText = null) {
      const method = endpoint.method.toUpperCase();
      const pathParams = (endpoint.parameters || []).filter(p => p.in === 'path');
      const queryParams = (endpoint.parameters || []).filter(p => p.in === 'query');
      const headerParams = (endpoint.parameters || []).filter(p => p.in === 'header');

      const lines = [];
      lines.push(`// ${method} ${endpoint.path}`);
      lines.push(`// ${endpoint.summary || 'Execute API call'}`);
      lines.push(``);
      lines.push(`async function executeRequest() {`);

      // 1. Path parameters
      let pathExpr = endpoint.path;
      if (pathParams.length > 0) {
        lines.push(`  // 1. Path parameters`);
        for (const p of pathParams) {
          const customVal = liveParamValues[p.name];
          const val = customVal !== undefined ? JSON.stringify(customVal) : (p.example !== undefined ? JSON.stringify(p.example) : (p.default !== undefined ? JSON.stringify(p.default) : (p.type === 'integer' || p.type === 'number' ? '42' : '"sample-id"')));
          lines.push(`  const ${sanitizeVarName(p.name)} = ${val};`);

      }

      const cleanBase = (baseUrl || 'https://api.example.com').replace(/\/$/, '');

      // 2. URL & Query parameters
      if (queryParams.length > 0) {
        lines.push(``);
        lines.push(`  // 2. Target URL & Query parameters`);
        lines.push(`  const url = new URL(\`${cleanBase}${pathExpr}\`);`);
        for (const q of queryParams) {
          const customVal = liveParamValues[q.name];
          const val = customVal !== undefined ? customVal : (q.example !== undefined ? q.example : (q.default !== undefined ? q.default : (q.enum ? q.enum[0] : 'sample_value')));
          lines.push(`  url.searchParams.append('${q.name}', '${val}');`);
        }
      } else {
        lines.push(``);
        lines.push(`  // Target URL`);
        lines.push(`  const url = new URL(\`${cleanBase}${pathExpr}\`);`);
      }

      // 3. Headers
      lines.push(``);
      lines.push(`  // 3. Request headers`);
      lines.push(`  const headers = {`);
      lines.push(`    'Accept': 'application/json',`);
      if (endpoint.requestBody) {
        lines.push(`    'Content-Type': '${endpoint.requestBody.contentType || 'application/json'}',`);
      }
      const tokenVal = state.apiToken || 'YOUR_API_TOKEN';
      lines.push(`    'Authorization': 'Bearer ${tokenVal}',`);
      for (const h of headerParams) {
        if (h.name.toLowerCase() === 'authorization') continue;
        const customVal = liveParamValues[h.name];
        const val = customVal !== undefined ? customVal : (h.example || h.default || 'demo_token');
        lines.push(`    '${h.name}': '${val}',`);
      }
      lines.push(`  };`);

      let hasBody = false;
      if (endpoint.requestBody && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
        hasBody = true;
        let mock = endpoint.requestBody.exampleData || {};
        if (liveBodyText) {

          }
        }
        const formatted = JSON.stringify(mock, null, 2).split('\n').map((l, i) => i === 0 ? l : '  ' + l).join('\n');
        lines.push(``);
        lines.push(`  // 4. Request payload`);
        lines.push(`  const payload = ${formatted};`);
      }

      // 5. Fetch Execution
      lines.push(``);
      lines.push(`  try {`);
      lines.push(`    const response = await fetch(url.toString(), {`);
      lines.push(`      method: '${method}',`);
      lines.push(`      headers,`);
      if (hasBody) {
        lines.push(`      body: JSON.stringify(payload),`);
      }
      lines.push(`    });`);
      lines.push(``);
      lines.push(`    if (!response.ok) {`);
      lines.push(`      throw new Error(\`HTTP error \${response.status}: \${response.statusText}\`);`);
      lines.push(`    }`);
      lines.push(``);
      lines.push(`    const data = await response.json();`);
      lines.push(`    console.log('Response data:', data);`);
      lines.push(`    return data;`);
      lines.push(`  } catch (error) {`);
      lines.push(`    console.error('Request failed:', error);`);
      lines.push(`    throw error;`);
      lines.push(`  }`);
      lines.push(`}`);
      lines.push(``);
      lines.push(`// Execute API invocation`);
      lines.push(`executeRequest();`);

    /**
