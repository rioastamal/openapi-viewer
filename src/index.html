<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAPI & Swagger Documentation Client</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            accent: {
              DEFAULT: '#1ebea5',
              hover: '#179b87',
              dark: '#13796a',
              light: '#eafaf7',
              border: '#a7ece0',
              gray: '#f1f1f1',
              text: '#333333'
            },
            brand: {
              50: '#eafaf7',
              100: '#d0f5ee',
              200: '#a7ece0',
              300: '#72dfcf',
              400: '#3dccb8',
              500: '#1ebea5',
              600: '#1ebea5',
              700: '#179b87',
              800: '#13796a',
              900: '#115e53',
              950: '#073630'
            },
            blue: {
              50: '#eafaf7',
              100: '#d0f5ee',
              200: '#a7ece0',
              300: '#72dfcf',
              400: '#3dccb8',
              500: '#1ebea5',
              600: '#1ebea5',
              700: '#179b87',
              800: '#13796a',
              900: '#115e53',
              950: '#073630'
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Highlight.js CDN (Atom One Dark theme & syntax highlighters) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- js-yaml CDN (for client-side YAML OpenAPI/Swagger parsing) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

  <style>
    /* Custom sleek scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.7);
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.5);
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.8);
    }

    /* Code Block & Syntax Highlighting Tokens (Atom One Dark theme) */
    pre code, pre code.hljs {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace !important;
      font-size: 0.825rem;
      line-height: 1.6;
      background: transparent !important;
      tab-size: 2;
    }
    .hljs-comment, .token-comment { color: #7f848e !important; font-style: italic; }
    .hljs-keyword, .token-keyword { color: #c678dd !important; font-weight: 600; }
    .hljs-string, .token-string { color: #98c379 !important; }
    .hljs-number, .token-number { color: #d19a66 !important; }
    .hljs-literal, .hljs-boolean, .token-boolean, .token-null { color: #56b6c2 !important; font-weight: 600; }
    .hljs-function, .hljs-title, .hljs-title.function_, .token-function { color: #61afef !important; font-weight: 600; }
    .hljs-built_in, .token-builtin { color: #e5c07b !important; }
    .hljs-attr, .token-key { color: #e06c75 !important; }
    .hljs-params { color: #e5c07b !important; }
    .hljs-variable { color: #e06c75 !important; }
    .hljs-punctuation, .hljs-operator, .token-operator { color: #abb2bf !important; }
    .hljs-property { color: #e5c07b !important; }
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }

  </style>

  <!-- Theme Stylesheet (Injected by build.sh) -->
  <!-- __THEME_START__ -->
  <link rel="stylesheet" href="themes/default.css">
  <!-- __THEME_END__ -->
</head>
<body class="h-full w-full max-w-full overflow-x-hidden bg-white text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex flex-col font-sans transition-colors duration-200">

  <!-- ========================================== -->
  <!-- TOAST NOTIFICATIONS BANNER                 -->
  <!-- ========================================== -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ========================================== -->
  <!-- ERROR / STATUS BANNER                      -->
  <!-- ========================================== -->
  <div id="global-alert" class="hidden px-4 py-2.5 text-xs font-medium bg-rose-50 dark:bg-rose-950/60 border-b border-rose-200 dark:border-rose-900/50 text-rose-800 dark:text-rose-300 flex items-center justify-between">
    <div class="flex items-center gap-2 max-w-5xl mx-auto w-full">
      <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-rose-600 dark:text-rose-400"></i>
      <span id="global-alert-text" class="flex-1"></span>
      <button id="btn-dismiss-alert" class="text-rose-600 hover:text-rose-900 dark:hover:text-rose-200 font-semibold p-1">Dismiss</button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- TOP HEADER                                 -->
  <!-- ========================================== -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 transition-colors w-full max-w-full overflow-hidden">
    <div class="max-w-[1920px] mx-auto px-2.5 sm:px-6 lg:px-4 h-14 sm:h-16 flex items-center justify-between gap-2 sm:gap-4 w-full min-w-0">

      <!-- Brand & Spec Metadata -->
      <div class="flex items-center gap-1.5 sm:gap-3 min-w-0 flex-1 overflow-hidden">
        <!-- Mobile Drawer Hamburger Button -->
        <button id="btn-toggle-mobile-menu" class="lg:hidden p-1.5 sm:p-2 -ml-1 sm:-ml-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none flex-shrink-0" aria-label="Toggle navigation">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-emerald-400 text-white flex items-center justify-center shadow-sm flex-shrink-0">
            <i data-lucide="zap" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          </div>
          <div class="min-w-0 flex items-baseline gap-1.5 sm:gap-2">
            <h1 id="header-api-title" class="font-bold text-slate-900 dark:text-white text-sm sm:text-base lg:text-lg truncate tracking-tight">OpenAPI Spec Viewer</h1>
            <span id="header-api-version" class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">v1.0</span>
          </div>
        </div>
      </div>

      <!-- Spec Controls Toolbar -->
      <div class="flex items-center gap-1 sm:gap-2.5 flex-shrink-0">

        <!-- __COMPONENT_LOAD_URL_START__ -->
        <!-- Remote URL Input & Fetch Form -->
        <form id="form-fetch-remote" class="hidden md:flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800/80 rounded-lg p-1 border border-slate-200 dark:border-slate-700">
          <i data-lucide="globe" class="w-4 h-4 ml-1.5 text-slate-400"></i>
          <input
            type="url"
            id="input-spec-url"
            placeholder="Remote OpenAPI JSON/YAML URL..."
            class="bg-transparent text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none w-48 lg:w-64 px-1.5"
            required
          >
          <button
            type="submit"
            id="btn-fetch-spec"
            class="px-2.5 py-1 text-xs font-medium rounded-md bg-blue-600 hover:bg-blue-700 text-white transition shadow-sm flex items-center gap-1"
          >
            <span>Fetch</span>
          </button>
        </form>
        <!-- __COMPONENT_LOAD_URL_END__ -->


        <!-- __COMPONENT_UPLOAD_START__ -->
        <!-- File Upload Button -->
        <label for="spec-file-input" class="inline-flex items-center gap-1.5 p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm cursor-pointer flex-shrink-0" title="Load local OpenAPI or Swagger JSON/YAML file">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Upload Spec</span>
        </label>
        <input type="file" id="spec-file-input" accept=".json,.yaml,.yml" class="hidden">
        <!-- __COMPONENT_UPLOAD_END__ -->

        <!-- Variables Button -->
        <button id="btn-open-variables-modal" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition shadow-sm flex-shrink-0" title="Manage Variables">
          <i data-lucide="variable" class="w-3.5 h-3.5 text-blue-600 dark:text-blue-400"></i>
          <span class="hidden sm:inline" id="btn-variables-label">Variables</span>
          <span id="variables-status-badge" class="hidden text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 font-semibold"></span>
        </button>

        <!-- Reset Demo Button -->
        <button id="btn-reset-demo" class="p-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition flex-shrink-0" title="Reset Demo Spec">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>

        <!-- Dark Mode Toggle -->
        <button id="btn-theme-toggle" class="p-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition flex-shrink-0" title="Toggle Theme">
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- ========================================== -->
  <!-- MOBILE RESPONSIVE SEGMENTED TABS           -->
  <!-- ========================================== -->
  <div class="lg:hidden sticky top-14 sm:top-16 z-30 bg-slate-100 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 sm:px-4 py-2 w-full max-w-full">
    <div class="flex rounded-lg bg-slate-200 dark:bg-slate-800 p-0.5 max-w-sm mx-auto w-full min-w-0">
      <button id="mobile-tab-docs" class="flex-1 py-1.5 text-xs font-medium rounded-md transition shadow-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white flex items-center justify-center gap-1.5">
        <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
        <span>Documentation</span>
      </button>
      <button id="mobile-tab-code" class="flex-1 py-1.5 text-xs font-medium rounded-md transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center gap-1.5">
        <i data-lucide="code" class="w-3.5 h-3.5"></i>
        <span>Code &amp; Client</span>
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MAIN 3-COLUMN CONTENT WRAPPER              -->
  <!-- ========================================== -->
  <div class="flex-1 w-full max-w-full mx-auto flex overflow-hidden min-h-0 relative">

    <!-- Mobile Drawer Backdrop -->
    <div id="mobile-drawer-backdrop" class="fixed inset-0 bg-slate-900/60 z-40 backdrop-blur-sm hidden transition-opacity lg:hidden"></div>

    <!-- ======================================== -->
    <!-- LEFT COLUMN: API NAVIGATION (20-25%)     -->
    <!-- ======================================== -->
    <aside id="sidebar-container" class="fixed inset-y-0 left-0 z-50 w-72 sm:w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full transition-transform duration-200 ease-in-out lg:translate-x-0 lg:static lg:z-10 lg:w-72 xl:w-80 flex flex-col flex-shrink-0 h-full min-h-0">

      <!-- Mobile Drawer Close Header -->
      <div class="lg:hidden flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800 flex-shrink-0">
        <span class="font-bold text-sm text-slate-800 dark:text-slate-100">API Endpoints</span>
        <button id="btn-close-mobile-menu" class="p-1 rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Desktop Sidebar Collapse Header (Above Search Box) -->
      <div class="hidden lg:flex items-center justify-between px-3.5 py-2.5 border-b border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/80 flex-shrink-0">
        <button
          id="btn-toggle-sidebar"
          class="inline-flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 transition group"
          title="Collapse Navigation Sidebar"
          aria-label="Collapse Navigation Sidebar"
        >
          <span class="p-1 rounded bg-slate-200/70 dark:bg-slate-800 text-slate-600 dark:text-slate-400 group-hover:bg-blue-100 dark:group-hover:bg-blue-900/40 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </span>
          <span id="sidebar-header-label" class="tracking-tight">Endpoints and Guides</span>
        </button>
      </div>

      <!-- Navigation Search Bar -->
      <div class="p-3 border-b border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-slate-900 flex-shrink-0">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400 pointer-events-none"></i>
          <input
            type="text"
            id="input-filter"
            placeholder="Filter endpoints, tags..."
            class="w-full pl-9 pr-8 py-1.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500"
          >
          <button id="btn-clear-search" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Tag Filter Selector -->
        <div class="flex items-center gap-1.5 mt-2 overflow-x-auto pb-1" id="tag-filter-pills">
          <!-- Dynamically populated tag filter pills -->
        </div>
      </div>

      <!-- Navigation Endpoints List -->
      <nav id="nav-endpoints-tree" class="flex-1 overflow-y-auto px-2 py-3 space-y-4">
        <!-- Rendered dynamically by renderSidebar() -->
      </nav>

      <!-- Sidebar Footer Info -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 dark:text-slate-500 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/50 flex-shrink-0">
        <span id="sidebar-endpoint-counter">13 endpoints</span>
        <span class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>Online</span>
        </span>
      </div>

    </aside>

    <!-- ======================================== -->
    <!-- MIDDLE COLUMN: DOCUMENTATION (45-50%)    -->
    <!-- ======================================== -->
    <main id="docs-container" class="flex-1 min-w-0 w-full max-w-full overflow-y-auto overflow-x-hidden px-3 sm:px-6 lg:px-8 py-4 sm:py-6 pb-36 h-full min-h-0 relative">
      <!-- Docked Sticky Expand Navigation Button (Visible on Desktop when Sidebar is Collapsed) -->
      <button
        id="btn-expand-sidebar"
        class="hidden fixed left-2 top-20 z-30 p-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 shadow-md border border-slate-200 dark:border-slate-700 transition items-center gap-1 text-xs font-medium group"
        title="Show Navigation Sidebar"
        aria-label="Show Navigation Sidebar"
      >
        <i data-lucide="chevron-right" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform"></i>
        <span class="hidden xl:inline text-[11px]">Navigation</span>
      </button>

      <!-- Docked Sticky Toggle Live Client / Code Panel Arrow Button (Visible on Desktop when Panel is Collapsed) -->
      <button
        id="btn-expand-code-panel"
        class="hidden fixed right-2 top-20 z-30 p-1.5 rounded-lg bg-slate-900 text-slate-300 hover:text-white hover:bg-slate-800 shadow-md border border-slate-700 transition items-center gap-1 text-xs font-medium group"
        title="Show Live Client &amp; Code Panel"
        aria-label="Show Live Client &amp; Code Panel"
      >
        <i data-lucide="chevron-left" class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"></i>
        <span class="hidden xl:inline text-[11px]">Live Client</span>
      </button>

      <!-- Dynamically populated by renderDetails() -->
      <div id="endpoint-details-view" class="max-w-3xl mx-auto space-y-6 sm:space-y-8 w-full min-w-0">
        <!-- Content rendered here -->
      </div>
    </main>

    <!-- ======================================== -->
    <!-- RIGHT COLUMN: MULTI-LANG CLIENT (30%+)   -->
    <!-- ======================================== -->
    <aside id="code-container" class="hidden lg:flex w-full max-w-full lg:w-[480px] xl:w-[560px] 2xl:w-[640px] flex-shrink-0 min-w-0 border-l border-slate-200 dark:border-slate-800 bg-slate-950 text-slate-100 flex-col h-full min-h-0 overflow-y-auto overflow-x-hidden">

      <!-- Sticky Sleek Header & Multi-Language Switcher -->
      <div class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 flex-shrink-0">

        <!-- Language Selectors & Try Button -->
        <div class="flex items-center gap-1.5 min-w-0">
          <!-- Mobile Dropdown Selector (Active on < sm) -->
          <select
            id="select-code-lang-mobile"
            class="sm:hidden text-xs bg-slate-800 text-slate-100 border border-slate-700 rounded-md px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-500 font-medium cursor-pointer"
            aria-label="Select Code Language"
          >
            <option value="curl" selected>cURL</option>
            <option value="javascript">JavaScript</option>
            <option value="php">PHP</option>
            <option value="golang">Golang</option>
          </select>

          <!-- Desktop Language Pills (Active on >= sm) -->
          <div class="hidden sm:flex rounded-lg bg-slate-800/90 p-0.5 text-xs font-medium" id="desktop-lang-pills">
            <button data-lang="curl" class="lang-tab-btn px-2.5 py-1 rounded-md bg-blue-600 text-white shadow-sm transition font-medium">cURL</button>
            <button data-lang="javascript" class="lang-tab-btn px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition font-medium">JS</button>
            <button data-lang="php" class="lang-tab-btn px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition font-medium">PHP</button>
            <button data-lang="golang" class="lang-tab-btn px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition font-medium">Golang</button>
          </div>

          <div class="h-4 w-px bg-slate-800 mx-0.5 hidden sm:block"></div>

          <!-- Interactive Test Toggle Button -->
          <button
            id="btn-toggle-interactive-test"
            class="px-2 py-1 text-xs font-medium rounded-md text-slate-300 hover:text-white hover:bg-slate-800 border border-transparent transition flex items-center gap-1"
            title="Interactive Client Request Tester"
          >
            <i data-lucide="play" class="w-3 h-3 text-emerald-400"></i>
            <span class="hidden md:inline">Try It</span>
          </button>
        </div>

        <div class="flex items-center gap-1 flex-shrink-0">
          <!-- Copy Code Button -->
          <button
            id="btn-copy-code"
            class="flex items-center gap-1.5 px-3 py-1 text-xs font-medium text-slate-200 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md transition shadow-sm flex-shrink-0"
            title="Copy code snippet"
          >
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span id="copy-btn-text">Copy</span>
          </button>

          <!-- Toggle Fullscreen Live Client / Code Panel Button (Desktop Only) -->
          <button
            id="btn-fullscreen-code-panel"
            class="hidden lg:inline-flex items-center gap-1 px-2 py-1 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-transparent rounded-md transition"
            title="Expand Live Client &amp; Code Panel to Full Screen"
            aria-label="Toggle Full Screen Live Client"
            aria-pressed="false"
          >
            <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
          </button>

          <!-- Toggle Right Panel Button (Collapse Right - Desktop Only) -->
          <button
            id="btn-toggle-code-panel"
            class="hidden lg:inline-flex p-1 text-slate-400 hover:text-white hover:bg-slate-800 rounded-md transition items-center justify-center"
            title="Collapse Code &amp; Client Panel"
            aria-label="Collapse Code &amp; Client Panel"
          >
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Tab 1: Dynamic Fetch Code Snippet (Full Width, Ample Bottom Padding) -->
      <div id="panel-code-snippet" class="w-full flex-1 flex flex-col p-2 sm:p-4 pb-36 sm:pb-28">
        <div id="code-snippet-example-bar"></div>
        <div class="relative w-full">
          <pre class="w-full rounded-xl bg-slate-900 border border-slate-800/80 overflow-x-auto p-4 mb-4"><code id="code-snippet-pre" class="language-javascript block w-full"></code></pre>
        </div>
      </div>

      <!-- Tab 2: Interactive API Request Tester (Full Width, Ample Bottom Padding) -->
      <div id="panel-interactive-try" class="hidden w-full flex-1 flex flex-col space-y-4 p-3 sm:p-4 pb-36 sm:pb-28">
        <div id="live-client-request-card" class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-3">
          <div class="flex items-center justify-between gap-2 flex-wrap">

  <!-- ===================================================================================== -->
  <!-- VANILLA JAVASCRIPT APPLICATION CORE                                                   -->
  <!-- ===================================================================================== -->
  <script>
    'use strict';

    /**
     * ============================================================================
     * 1. EMBEDDED SPECIFICATION
     * ============================================================================
     */
    // __EMBEDDED_SPEC_START__
    const EMBEDDED_OPENAPI_SPEC = null;
    // __EMBEDDED_SPEC_END__
    // __EMBEDDED_SERVER_URL_START__
    const EMBEDDED_SERVER_URL = null;
    // __EMBEDDED_SERVER_URL_END__
    /**
     * ============================================================================
     * 2. SPEC RESOLUTION & DEREFERENCING HELPERS
     * ============================================================================
     */
    function resolveJsonPointer(root, ref) {
      if (!ref || typeof ref !== 'string' || !ref.startsWith('#/')) {
        return null;
      }
      const parts = ref.substring(2).split('/').map(p => p.replace(/~1/g, '/').replace(/~0/g, '~'));
      let curr = root;
      for (const part of parts) {
        if (curr && typeof curr === 'object' && part in curr) {
          curr = curr[part];
        } else {
          return null;
        }
      }
      return curr;
    }

    function dereferenceSchema(root, schema, depth = 0, visited = new Set()) {
      if (!schema || typeof schema !== 'object' || depth > 12) return schema;

      if (schema.$ref) {
        if (visited.has(schema.$ref)) {
          return { type: 'object', description: `[Circular: ${schema.$ref}]` };
        }
        const nextVisited = new Set(visited);
        nextVisited.add(schema.$ref);
        const resolved = resolveJsonPointer(root, schema.$ref);
        if (resolved) {
          const { $ref, ...rest } = schema;
          const merged = { ...resolved, ...rest };
          return dereferenceSchema(root, merged, depth + 1, nextVisited);
        }
        return schema;
      }

      if (schema.allOf && Array.isArray(schema.allOf)) {
        const merged = {};
        for (const sub of schema.allOf) {
          const derefSub = dereferenceSchema(root, sub, depth + 1, visited);
          if (derefSub && typeof derefSub === 'object') {
            Object.assign(merged, derefSub);
            if (derefSub.properties) {
              merged.properties = Object.assign({}, merged.properties || {}, derefSub.properties);
            }
            if (derefSub.required) {
              merged.required = Array.from(new Set([...(merged.required || []), ...derefSub.required]));
            }
          }
        }
        return merged;
      }

      if (schema.oneOf && Array.isArray(schema.oneOf) && schema.oneOf.length > 0) {
        return dereferenceSchema(root, schema.oneOf[0], depth + 1, visited);
      }
      if (schema.anyOf && Array.isArray(schema.anyOf) && schema.anyOf.length > 0) {
        return dereferenceSchema(root, schema.anyOf[0], depth + 1, visited);
      }

      const result = Array.isArray(schema) ? [] : {};
      for (const [key, val] of Object.entries(schema)) {
        if (val && typeof val === 'object') {
          result[key] = dereferenceSchema(root, val, depth + 1, visited);
        } else {
          result[key] = val;
        }
      }
      return result;
    }

    /**
     * Generates a realistic mock JavaScript object from a JSON schema
     */
    function generateMockFromSchema(schema, propName = '', depth = 0) {
      if (!schema || depth > 8) return null;

      if (schema.example !== undefined) return schema.example;
      if (schema.default !== undefined) return schema.default;
      if (schema.examples && Array.isArray(schema.examples) && schema.examples.length > 0) return schema.examples[0];
      if (schema.enum && schema.enum.length > 0) return schema.enum[0];

      const type = schema.type || (schema.properties ? 'object' : (schema.items ? 'array' : 'string'));

      switch (type) {
        case 'string':
          if (schema.format === 'date-time') return '2026-09-30T14:20:00.000Z';
          if (schema.format === 'date') return '2026-09-30';
          if (schema.format === 'email') return 'user@example.com';
          if (schema.format === 'uri' || schema.format === 'url') return 'https://images.unsplash.com/photo-1552053831-71594a27632d';
          if (schema.format === 'uuid') return 'a81d432e-b4a1-4fc6-b72e-0f8a92bc13d8';
          if (schema.format === 'password') return '********';
          if (propName.toLowerCase().includes('email')) return 'user@example.com';
          if (propName.toLowerCase().includes('name')) return 'Apollo';
          if (propName.toLowerCase().includes('status')) return 'available';
          if (propName.toLowerCase().includes('id')) return 'usr_9824';
          return 'sample_string';

        case 'integer':
          if (propName.toLowerCase().includes('id')) return 42;
          if (propName.toLowerCase().includes('code')) return 200;
          if (propName.toLowerCase().includes('count') || propName.toLowerCase().includes('qty') || propName.toLowerCase().includes('quantity')) return 1;
          return 10;

        case 'number':
          return 29.99;

        case 'boolean':
          return true;

        case 'array':
          if (schema.items) {
            return [generateMockFromSchema(schema.items, propName, depth + 1)];
          }
          return [];

        case 'object':
          if (schema.properties) {
            const obj = {};
            for (const [k, p] of Object.entries(schema.properties)) {
              obj[k] = generateMockFromSchema(p, k, depth + 1);
            }
            return obj;
          }
          return {};

        default:
          return 'sample_value';
      }
    }

    /**
     * Flattens a nested schema into readable rows for parameter tables
     */
    function flattenSchemaProperties(schema, prefix = '') {
      if (!schema) return [];
      const rows = [];
      const requiredSet = new Set(schema.required || []);

      if (schema.properties) {
        for (const [key, prop] of Object.entries(schema.properties)) {
          const isReq = requiredSet.has(key);
          const fullName = prefix ? `${prefix}.${key}` : key;
          const type = prop.type || (prop.properties ? 'object' : (prop.items ? 'array' : 'any'));
          const format = prop.format ? ` (${prop.format})` : '';
          const itemsType = prop.items ? `[${prop.items.type || (prop.items.properties ? 'object' : 'any')}]` : '';

          rows.push({
            name: fullName,
            required: isReq,
            type: `${type}${itemsType}${format}`,
            description: prop.description || '',
            example: prop.example !== undefined ? JSON.stringify(prop.example) : '',
            enum: prop.enum ? prop.enum.join(', ') : '',
            default: prop.default !== undefined ? JSON.stringify(prop.default) : ''
          });

          if (prop.properties) {
            rows.push(...flattenSchemaProperties(prop, fullName));
          } else if (prop.items && prop.items.properties) {
            rows.push(...flattenSchemaProperties(prop.items, `${fullName}[]`));
          }
        }
      } else if (schema.type === 'array' && schema.items) {
        if (schema.items.properties) {
          rows.push(...flattenSchemaProperties(schema.items, 'item'));
        } else {
          rows.push({
            name: 'item',
            required: true,
            type: schema.items.type || 'any',
            description: schema.items.description || '',
            example: schema.items.example !== undefined ? JSON.stringify(schema.items.example) : '',
            enum: schema.items.enum ? schema.items.enum.join(', ') : '',
            default: ''
          });
        }
      }

      return rows;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Extracts an array of Example objects from OpenAPI 3.x / Swagger 2.0 definitions.
     * Supports mediaObj.examples (map of Example Objects or $ref), mediaObj.example,
     * schema.examples (JSON Schema array or map), schema.example, and fallback to mock generator.
     */
    function extractExamplesList(mediaObj, schema, rawDoc) {
      const list = [];
      if (!mediaObj && !schema) return list;

      // 1. Check mediaObj.examples (OpenAPI 3.x Map of Example Objects or $ref)
      if (mediaObj && mediaObj.examples && typeof mediaObj.examples === 'object') {
        for (const [key, rawEx] of Object.entries(mediaObj.examples)) {
          if (!rawEx) continue;
          const ex = rawEx.$ref ? (resolveJsonPointer(rawDoc, rawEx.$ref) || rawEx) : rawEx;
          let val = undefined;
          if (ex.value !== undefined) {
            val = ex.value;
          } else if (ex.externalValue !== undefined) {
            val = ex.externalValue;
          } else if (typeof ex === 'object' && ex !== null && !('summary' in ex) && !('description' in ex) && !('$ref' in ex)) {
            val = ex;
          } else if (typeof ex !== 'object') {
            val = ex;
          } else {
            val = ex.value;
          }
          list.push({
            key,
            name: ex.summary || key,
            summary: ex.summary || '',
            description: ex.description || '',
            value: val
          });
        }
      }

      // 2. Check mediaObj.example (single example) if list is empty
      if (list.length === 0 && mediaObj && mediaObj.example !== undefined) {
        list.push({
          key: 'default',
          name: 'Default Example',
          summary: '',
          description: '',
          value: mediaObj.example
        });
      }

      // 3. Check schema.examples (Array in JSON Schema / OpenAPI 3.1 or Object)
      if (list.length === 0 && schema && schema.examples) {
        if (Array.isArray(schema.examples)) {
          schema.examples.forEach((item, idx) => {
            list.push({
              key: `example_${idx + 1}`,
              name: `Example ${idx + 1}`,
              summary: '',
              description: '',
              value: item
            });
          });
        } else if (typeof schema.examples === 'object') {
          for (const [key, rawEx] of Object.entries(schema.examples)) {
            const val = rawEx && typeof rawEx === 'object' && rawEx.value !== undefined ? rawEx.value : rawEx;
            list.push({
              key,
              name: (rawEx && rawEx.summary) || key,
              summary: (rawEx && rawEx.summary) || '',
              description: (rawEx && rawEx.description) || '',
              value: val
            });
          }
        }
      }

      // 4. Check schema.example
      if (list.length === 0 && schema && schema.example !== undefined) {
        list.push({
          key: 'default',
          name: 'Default Schema Example',
          summary: '',
          description: '',
          value: schema.example
        });
      }

      // 5. Generate mock from schema if still empty
      if (list.length === 0 && schema) {
        const mock = generateMockFromSchema(schema);
        if (mock !== null && mock !== undefined) {
          list.push({
            key: 'default',
            name: 'Schema Template',
            summary: 'Generated from schema definition',
            description: '',
            value: mock
          });
        }
      }

      return list;
    }

    /**
     * ============================================================================
     * 3. SPEC INGESTION & NORMALIZATION PIPELINE (OPENAPI 3.X & SWAGGER 2.0)
     * ============================================================================
     */
    /**
     * Normalize parsed YAML/JSON values (e.g. convert YAML Date instances to ISO strings,
     * and coerce non-string object keys cleanly).
     */
    function normalizeParsedSpec(val) {
      if (val instanceof Date) {
        const isMidnightUtc =
          val.getUTCHours() === 0 &&
          val.getUTCMinutes() === 0 &&
          val.getUTCSeconds() === 0 &&
          val.getUTCMilliseconds() === 0;
        return isMidnightUtc ? val.toISOString().slice(0, 10) : val.toISOString();
      }
      if (Array.isArray(val)) {
        return val.map(normalizeParsedSpec);
      }
      if (val && typeof val === 'object') {
        const out = {};
        for (const [k, v] of Object.entries(val)) {
          out[String(k)] = normalizeParsedSpec(v);
        }
        return out;
      }
      return val;
    }

    /**
     * Parse raw specification text in JSON or YAML format into a normalized JS object.
     */
    function parseSpecText(rawText, sourceName = '') {
      if (!rawText || typeof rawText !== 'string' || !rawText.trim()) {
        throw new Error('Specification file is empty');
      }

      const cleanSource = String(sourceName || '').split('?')[0].split('#')[0].toLowerCase();
      const trimmed = rawText.trim();
      const isExplicitJson = cleanSource.endsWith('.json');
      const isExplicitYaml = cleanSource.endsWith('.yaml') || cleanSource.endsWith('.yml');

      let parsed = null;

      if (isExplicitJson || (!isExplicitYaml && (trimmed.startsWith('{') || trimmed.startsWith('[')))) {
        try {
          parsed = JSON.parse(rawText);
        } catch (jsonErr) {
          if (isExplicitJson) {
            throw new Error(`Invalid JSON: ${jsonErr.message}`);
          }
          // Unknown extension: fallback to YAML if JSON.parse failed
          parsed = undefined;
        }
      }

      if (parsed === undefined || parsed === null) {
        if (isExplicitJson) {
          throw new Error('Invalid JSON: expected a JSON object');
        }
        if (typeof window.jsyaml === 'undefined' || typeof window.jsyaml.loadAll !== 'function') {
          throw new Error('YAML parser (js-yaml) is not loaded. Check your network connection or use JSON format.');
        }

        const docs = [];
        try {
          window.jsyaml.loadAll(rawText, (doc) => {
            docs.push(doc);
          });
        } catch (yamlErr) {
          throw new Error(`Invalid YAML: ${yamlErr.message}`);
        }

        if (docs.length === 0 || (docs.length === 1 && (docs[0] === null || docs[0] === undefined))) {
          throw new Error('YAML file contains no specification data');
        }
        if (docs.length > 1) {
          throw new Error('Multiple YAML documents found; expected a single OpenAPI/Swagger document');
        }

        parsed = normalizeParsedSpec(docs[0]);
      }

      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        throw new Error('Invalid specification: root element must be a JSON or YAML object');
      }

      for (const verKey of ['openapi', 'swagger']) {
        if (typeof parsed[verKey] === 'number') {
          parsed[verKey] = String(parsed[verKey]);
        }
      }

      return parsed;
    }

    function parseOpenApiSpec(raw) {
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
        throw new Error("Invalid specification: expected a JSON or YAML object");
      }

      const openapiVer = raw.openapi !== undefined && raw.openapi !== null ? String(raw.openapi) : '';
      const swaggerVer = raw.swagger !== undefined && raw.swagger !== null ? String(raw.swagger) : '';
      const isOpenApi3 = /^3(\.|$)/.test(openapiVer);
      const isSwagger2 = /^2(\.|$)/.test(swaggerVer);

      if (!isOpenApi3 && !isSwagger2) {
        throw new Error("Unsupported format: document must specify 'openapi: 3.x' or 'swagger: 2.0'");
      }

      // Metadata
      const info = {
        title: raw.info?.title || "OpenAPI Specification",
        version: raw.info?.version !== undefined && raw.info?.version !== null ? String(raw.info.version) : "1.0.0",
        description: raw.info?.description || "",
        termsOfService: raw.info?.termsOfService || "",
        contact: raw.info?.contact || null,
        license: raw.info?.license || null,
      };

      // Base URL resolution
      let baseUrl = "https://api.example.com";
      if (typeof EMBEDDED_SERVER_URL !== "undefined" && EMBEDDED_SERVER_URL) {
        baseUrl = String(EMBEDDED_SERVER_URL).trim();
      } else if (isOpenApi3) {
        if (raw.servers && raw.servers.length > 0 && raw.servers[0].url) {
          baseUrl = raw.servers[0].url;
        }
      } else if (isSwagger2) {
        const scheme = (raw.schemes && raw.schemes[0]) || "https";
        const host = raw.host || "api.example.com";
        const basePath = raw.basePath || "";
        baseUrl = `${scheme}://${host}${basePath}`;
      }

      const endpoints = [];
      const paths = raw.paths || {};
      const httpMethods = ['get', 'post', 'put', 'patch', 'delete', 'options', 'head'];

      // Map to hold path-level x-page definitions
      const pathPages = {};

      for (const [pathStr, pathItem] of Object.entries(paths)) {
        if (!pathItem || typeof pathItem !== 'object') continue;

        // Extract optional path-level x-page definition
        const rawXPage = pathItem['x-page'] || pathItem['x-pages'];
        if (rawXPage && typeof rawXPage === 'object') {
          const xp = Array.isArray(rawXPage) ? rawXPage[0] : rawXPage;
          if (xp) {
            const pageId = `path-page-${pathStr.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
            pathPages[pathStr] = {
              id: pageId,
              path: pathStr,
              title: xp.title || xp.name || pathStr,
              icon: xp.icon || 'info',
              content: typeof xp.content === 'string' ? xp.content : (xp.description || '')
            };
          }
        }

        // Path-level parameters
        const pathLevelParams = Array.isArray(pathItem.parameters) ? pathItem.parameters : [];

        for (const method of httpMethods) {
          if (!pathItem[method]) continue;
          const op = pathItem[method];

          const endpointId = `${method.toLowerCase()}-${pathStr.replace(/[^a-zA-Z0-9_-]/g, '_')}`;

          // Combine parameters (operation-level override path-level)
          const opParams = Array.isArray(op.parameters) ? op.parameters : [];
          const combinedParamsMap = new Map();

          for (const p of [...pathLevelParams, ...opParams]) {
            if (!p) continue;
            const resolvedParam = p.$ref ? resolveJsonPointer(raw, p.$ref) || p : p;
            const key = `${resolvedParam.in || 'query'}:${resolvedParam.name}`;
            combinedParamsMap.set(key, resolvedParam);
          }

          const allParamsList = Array.from(combinedParamsMap.values());

          let requestBody = null;
          const normalizedParams = [];

          if (isOpenApi3) {
            for (const p of allParamsList) {
              const paramSchema = p.schema ? dereferenceSchema(raw, p.schema) : { type: 'string' };
              let paramExamples = [];
              if (p.examples) {
                paramExamples = extractExamplesList({ examples: p.examples }, paramSchema, raw);
              } else if (p.content) {
                const ct = Object.keys(p.content)[0];
                if (ct && p.content[ct]) {
                  paramExamples = extractExamplesList(p.content[ct], paramSchema, raw);
                }
              }

              normalizedParams.push({
                name: p.name,
                in: p.in || 'query',
                description: p.description || '',
                required: !!p.required,
                type: paramSchema.type ? (paramSchema.type + (paramSchema.items ? `[${paramSchema.items.type || 'object'}]` : '')) : 'string',
                format: paramSchema.format || '',
                enum: paramSchema.enum || null,
                default: paramSchema.default ?? p.default,
                example: p.example ?? paramSchema.example ?? (paramExamples[0]?.value) ?? (paramSchema.enum ? paramSchema.enum[0] : undefined),
                examples: paramExamples,
                schema: paramSchema
              });
            }

            if (op.requestBody) {
              const rb = op.requestBody.$ref ? resolveJsonPointer(raw, op.requestBody.$ref) || op.requestBody : op.requestBody;
              const content = rb.content || {};
              const contentType = Object.keys(content)[0] || 'application/json';
              const mediaObj = content[contentType] || {};
              const schema = mediaObj.schema ? dereferenceSchema(raw, mediaObj.schema) : null;
              const combinedMediaObj = {
                example: mediaObj.example ?? rb.example,
                examples: mediaObj.examples || rb.examples
              };
              const examples = extractExamplesList(combinedMediaObj, schema, raw);
              const exampleData = examples.length > 0 ? examples[0].value : (schema ? generateMockFromSchema(schema) : null);

              requestBody = {
                description: rb.description || '',
                required: !!rb.required,
                contentType,
                schema,
                examples,
                exampleData
              };
            }
          } else if (isSwagger2) {
            for (const p of allParamsList) {
              if (p.in === 'body') {
                const schema = p.schema ? dereferenceSchema(raw, p.schema) : null;
                const mediaObj = {
                  example: p.example || p['x-example'],
                  examples: p.examples || p['x-examples']
                };
                const examples = extractExamplesList(mediaObj, schema, raw);
                const exampleData = examples.length > 0 ? examples[0].value : (schema ? generateMockFromSchema(schema) : null);
                requestBody = {
                  description: p.description || '',
                  required: !!p.required,
                  contentType: (op.consumes && op.consumes[0]) || 'application/json',
                  schema,
                  examples,
                  exampleData
                };
              } else {
                const paramSchema = p.schema ? dereferenceSchema(raw, p.schema) : {
                  type: p.type || 'string',
                  format: p.format,
                  enum: p.enum,
                  default: p.default,
                  items: p.items
                };
                normalizedParams.push({
                  name: p.name,
                  in: p.in || 'query',
                  description: p.description || '',
                  required: !!p.required,
                  type: p.type ? (p.type + (p.items ? `[${p.items.type || 'object'}]` : '')) : 'string',
                  format: p.format || '',
                  enum: p.enum || null,
                  default: p.default,
                  example: p['x-example'] ?? p.default,
                  examples: [],
                  schema: paramSchema
                });
              }
            }
          }

          // Responses normalization
          const normalizedResponses = [];
          const responsesObj = op.responses || {};

          for (const [code, respVal] of Object.entries(responsesObj)) {
            if (!respVal) continue;
            const resp = respVal.$ref ? resolveJsonPointer(raw, respVal.$ref) || respVal : respVal;

            let schema = null;
            let examples = [];
            let exampleData = null;
            let contentType = 'application/json';

            if (isOpenApi3) {
              const content = resp.content || {};
              const firstCt = Object.keys(content)[0];
              if (firstCt) {
                contentType = firstCt;
                const media = content[firstCt] || {};
                schema = media.schema ? dereferenceSchema(raw, media.schema) : null;
                const combinedMediaObj = {
                  example: media.example ?? resp.example,
                  examples: media.examples || resp.examples
                };
                examples = extractExamplesList(combinedMediaObj, schema, raw);
                exampleData = examples.length > 0 ? examples[0].value : (schema ? generateMockFromSchema(schema) : null);
              }
            } else if (isSwagger2) {
              contentType = (op.produces && op.produces[0]) || 'application/json';
              schema = resp.schema ? dereferenceSchema(raw, resp.schema) : null;
              const mediaObj = {
                example: (resp.examples && resp.examples[contentType]) || resp.example,
                examples: resp.examples
              };
              examples = extractExamplesList(mediaObj, schema, raw);
              exampleData = examples.length > 0 ? examples[0].value : (schema ? generateMockFromSchema(schema) : null);
            }

            normalizedResponses.push({
              statusCode: code,
              description: resp.description || '',
              contentType,
              schema,
              examples,
              exampleData
            });
          }

          // Sort status codes (2xx, 3xx, 4xx, 5xx, default)
          normalizedResponses.sort((a, b) => {
            if (a.statusCode === 'default') return 1;
            if (b.statusCode === 'default') return -1;
            return a.statusCode.localeCompare(b.statusCode);
          });

          const tags = (op.tags && Array.isArray(op.tags) && op.tags.length > 0) ? op.tags : ['General'];

          endpoints.push({
            id: endpointId,
            method: method.toUpperCase(),
            path: pathStr,
            summary: op.summary || `${method.toUpperCase()} ${pathStr}`,
            description: op.description || '',
            operationId: op.operationId || '',
            tags,
            parameters: normalizedParams,
            requestBody,
            responses: normalizedResponses,
            pathPage: pathPages[pathStr] || null
          });
        }
      }

      // Unique tags extraction
      const tagsMap = new Map();
      if (Array.isArray(raw.tags)) {
        for (const t of raw.tags) {
          if (t && t.name) {
            tagsMap.set(t.name, { name: t.name, description: t.description || '' });
          }
        }
      }
      for (const ep of endpoints) {
        for (const tag of ep.tags) {
          if (!tagsMap.has(tag)) {
            tagsMap.set(tag, { name: tag, description: '' });
          }
        }
      }

      // Extract custom pages (e.g. x-pages or info["x-pages"])
      const rawPages = raw['x-pages'] || (raw.info && raw.info['x-pages']) || [];
      const pages = [];
      if (Array.isArray(rawPages)) {
        for (let i = 0; i < rawPages.length; i++) {
          const p = rawPages[i];
          if (!p || typeof p !== 'object') continue;
          const pageId = String(p.id || p.slug || `page-${i}`).trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
          pages.push({
            id: pageId,
            title: p.title || p.name || `Page ${i + 1}`,
            icon: p.icon || 'book-open',
            content: typeof p.content === 'string' ? p.content : (p.description || '')
          });
        }
      }

      return {
        specType: isOpenApi3 ? 'OpenAPI 3.x' : 'Swagger 2.0',
        info,
        baseUrl,
        endpoints,
        tags: Array.from(tagsMap.values()),
        pages,
        pathPages: Object.values(pathPages)
      };
    }

    /**
     * ============================================================================
     * 4. CODE SNIPPET GENERATOR (PURE ES6+ JAVASCRIPT FETCH API)

    function sanitizeVarName(name) {
      let clean = name.replace(/[^a-zA-Z0-9_$]/g, '_');
      if (/^[0-9]/.test(clean)) clean = '_' + clean;
      return clean;
    }

    function generateFetchCode(endpoint, baseUrl, liveParamValues = {}, liveBodyText = null) {
      const method = endpoint.method.toUpperCase();
      const pathParams = (endpoint.parameters || []).filter(p => p.in === 'path');
      const queryParams = (endpoint.parameters || []).filter(p => p.in === 'query');
      const headerParams = (endpoint.parameters || []).filter(p => p.in === 'header');

      const lines = [];
      lines.push(`// ${method} ${endpoint.path}`);
      lines.push(`// ${endpoint.summary || 'Execute API call'}`);
      lines.push(``);
      lines.push(`async function executeRequest() {`);

      // 1. Path parameters
      let pathExpr = endpoint.path;
      if (pathParams.length > 0) {
        lines.push(`  // 1. Path parameters`);
        for (const p of pathParams) {
          const customVal = liveParamValues[p.name];
          const val = customVal !== undefined ? JSON.stringify(customVal) : (p.example !== undefined ? JSON.stringify(p.example) : (p.default !== undefined ? JSON.stringify(p.default) : (p.type === 'integer' || p.type === 'number' ? '42' : '"sample-id"')));
          lines.push(`  const ${sanitizeVarName(p.name)} = ${val};`);
        }
      }

      for (const p of pathParams) {
        pathExpr = pathExpr.replace(`{${p.name}}`, `\${encodeURIComponent(${sanitizeVarName(p.name)})}`);
      }

      const cleanBase = (baseUrl || 'https://api.example.com').replace(/\/$/, '');

      // 2. URL & Query parameters
      if (queryParams.length > 0) {
        lines.push(``);
        lines.push(`  // 2. Target URL & Query parameters`);
        lines.push(`  const url = new URL(\`${cleanBase}${pathExpr}\`);`);
        for (const q of queryParams) {
          const customVal = liveParamValues[q.name];
          const val = customVal !== undefined ? customVal : (q.example !== undefined ? q.example : (q.default !== undefined ? q.default : (q.enum ? q.enum[0] : 'sample_value')));
          lines.push(`  url.searchParams.append('${q.name}', '${val}');`);
        }
      } else {
        lines.push(``);
        lines.push(`  // Target URL`);
        lines.push(`  const url = new URL(\`${cleanBase}${pathExpr}\`);`);
      }

      // 3. Headers
      lines.push(``);
      lines.push(`  // 3. Request headers`);
      lines.push(`  const headers = {`);
      lines.push(`    'Accept': 'application/json',`);
      if (endpoint.requestBody) {
        lines.push(`    'Content-Type': '${endpoint.requestBody.contentType || 'application/json'}',`);
      }
      lines.push(`    'Authorization': 'Bearer {API_TOKEN}',`);
      for (const h of headerParams) {
        if (h.name.toLowerCase() === 'authorization') continue;
        const customVal = liveParamValues[h.name];
        const val = customVal !== undefined ? customVal : (h.example || h.default || 'demo_token');
        lines.push(`    '${h.name}': '${val}',`);
      }
      lines.push(`  };`);

      // 4. Request Payload
      let hasBody = false;
      if (endpoint.requestBody && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
        hasBody = true;
        let mock = endpoint.requestBody.exampleData || {};
        if (liveBodyText) {
          try {
            mock = JSON.parse(liveBodyText);
          } catch (e) {
            // fallback to mock
          }
        }
        const formatted = JSON.stringify(mock, null, 2).split('\n').map((l, i) => i === 0 ? l : '  ' + l).join('\n');
        lines.push(``);
        lines.push(`  // 4. Request payload`);
        lines.push(`  const payload = ${formatted};`);
      }

      // 5. Fetch Execution
      lines.push(``);
      lines.push(`  try {`);
      lines.push(`    const response = await fetch(url.toString(), {`);
      lines.push(`      method: '${method}',`);
      lines.push(`      headers,`);
      if (hasBody) {
        lines.push(`      body: JSON.stringify(payload),`);
      }
      lines.push(`    });`);
      lines.push(``);
      lines.push(`    if (!response.ok) {`);
      lines.push(`      throw new Error(\`HTTP error \${response.status}: \${response.statusText}\`);`);
      lines.push(`    }`);
      lines.push(``);
      lines.push(`    const data = await response.json();`);
      lines.push(`    console.log('Response data:', data);`);
      lines.push(`    return data;`);
      lines.push(`  } catch (error) {`);
      lines.push(`    console.error('Request failed:', error);`);
      lines.push(`    throw error;`);
      lines.push(`  }`);
      lines.push(`}`);
      lines.push(``);
      lines.push(`// Execute API invocation`);
      lines.push(`executeRequest();`);

      return lines.join('\n');
    }

    /**
     * cURL Command Generator
     */
    function generateCurlCode(endpoint, baseUrl, liveParamValues = {}, liveBodyText = null) {
      const method = endpoint.method.toUpperCase();
      const pathParams = (endpoint.parameters || []).filter(p => p.in === 'path');
      const queryParams = (endpoint.parameters || []).filter(p => p.in === 'query');
      const headerParams = (endpoint.parameters || []).filter(p => p.in === 'header');

      let pathExpr = endpoint.path;
      for (const p of pathParams) {
        const val = liveParamValues[p.name] !== undefined ? liveParamValues[p.name] : (p.example !== undefined ? p.example : (p.default !== undefined ? p.default : '42'));
        pathExpr = pathExpr.replace(`{${p.name}}`, encodeURIComponent(val));
      }

      const cleanBase = (baseUrl || 'https://api.example.com').replace(/\/$/, '');
      let fullUrl = `${cleanBase}${pathExpr}`;

      if (queryParams.length > 0) {
        const qParts = [];
        for (const q of queryParams) {
          const val = liveParamValues[q.name] !== undefined ? liveParamValues[q.name] : (q.example !== undefined ? q.example : (q.default !== undefined ? q.default : (q.enum ? q.enum[0] : 'sample_value')));
          qParts.push(`${encodeURIComponent(q.name)}=${encodeURIComponent(val)}`);
        }
        fullUrl += `?${qParts.join('&')}`;
      }

      const lines = [];
      lines.push(`curl -X ${method} "${fullUrl}" \\`);
      lines.push(`  -H "Accept: application/json" \\`);

      if (endpoint.requestBody) {
        lines.push(`  -H "Content-Type: ${endpoint.requestBody.contentType || 'application/json'}" \\`);
      }

      lines.push(`  -H "Authorization: Bearer {API_TOKEN}" \\`);

      for (let i = 0; i < headerParams.length; i++) {
        const h = headerParams[i];
        if (h.name.toLowerCase() === 'authorization') continue;
        const val = liveParamValues[h.name] !== undefined ? liveParamValues[h.name] : (h.example || h.default || 'demo_token');
        lines.push(`  -H "${h.name}: ${val}" \\`);
      }

      if (endpoint.requestBody && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
        let mock = endpoint.requestBody.exampleData || {};
        if (liveBodyText) {
          try { mock = JSON.parse(liveBodyText); } catch (e) {}
        }
        const jsonStr = JSON.stringify(mock, null, 2);
        const escapedJson = jsonStr.replace(/'/g, `'\\''`);
        lines.push(`  -d '${escapedJson}'`);
      }

      const lastIdx = lines.length - 1;
      lines[lastIdx] = lines[lastIdx].replace(/\s*\\$/, '');

      return lines.join('\n');
    }

    /**
     * PHP (cURL) Code Generator
     */
    function toPhpArray(obj, indent = 0) {
      if (obj === null) return 'null';
      if (typeof obj === 'boolean') return obj ? 'true' : 'false';
      if (typeof obj === 'number') return String(obj);
      if (typeof obj === 'string') return JSON.stringify(obj);
      if (Array.isArray(obj)) {
        if (obj.length === 0) return '[]';
        const spaces = ' '.repeat(indent);
        const innerSpaces = ' '.repeat(indent + 4);
        const items = obj.map(item => `${innerSpaces}${toPhpArray(item, indent + 4)}`).join(',\n');
        return `[\n${items}\n${spaces}]`;
      }
      if (typeof obj === 'object') {
        const keys = Object.keys(obj);
        if (keys.length === 0) return '[]';
        const spaces = ' '.repeat(indent);
        const innerSpaces = ' '.repeat(indent + 4);
        const items = keys.map(k => `${innerSpaces}${JSON.stringify(k)} => ${toPhpArray(obj[k], indent + 4)}`).join(',\n');
        return `[\n${items}\n${spaces}]`;
      }
      return 'null';
    }

    function generatePhpCode(endpoint, baseUrl, liveParamValues = {}, liveBodyText = null) {
      const method = endpoint.method.toUpperCase();
      const pathParams = (endpoint.parameters || []).filter(p => p.in === 'path');
      const queryParams = (endpoint.parameters || []).filter(p => p.in === 'query');
      const headerParams = (endpoint.parameters || []).filter(p => p.in === 'header');

      let pathExpr = endpoint.path;
      for (const p of pathParams) {
        const val = liveParamValues[p.name] !== undefined ? liveParamValues[p.name] : (p.example !== undefined ? p.example : '42');
        pathExpr = pathExpr.replace(`{${p.name}}`, val);
      }

      const cleanBase = (baseUrl || 'https://api.example.com').replace(/\/$/, '');
      const lines = [];
      lines.push(`<?php`);
      lines.push(`// ${method} ${endpoint.path} - ${endpoint.summary || 'API Request'}`);
      lines.push(``);

      if (queryParams.length > 0) {
        lines.push(`$queryParams = http_build_query([`);
        for (const q of queryParams) {
          const val = liveParamValues[q.name] !== undefined ? liveParamValues[q.name] : (q.example !== undefined ? q.example : (q.default !== undefined ? q.default : 'sample'));
          lines.push(`    "${q.name}" => ${JSON.stringify(val)},`);
        }
        lines.push(`]);`);
        lines.push(`$url = "${cleanBase}${pathExpr}?" . $queryParams;`);
      } else {
        lines.push(`$url = "${cleanBase}${pathExpr}";`);
      }

      lines.push(``);
      lines.push(`$headers = [`);
      lines.push(`    "Accept: application/json",`);
      if (endpoint.requestBody) {
        lines.push(`    "Content-Type: ${endpoint.requestBody.contentType || 'application/json'}",`);
      }
      lines.push(`    "Authorization: Bearer {API_TOKEN}",`);
      for (const h of headerParams) {
        if (h.name.toLowerCase() === 'authorization') continue;
        const val = liveParamValues[h.name] !== undefined ? liveParamValues[h.name] : (h.example || h.default || 'demo_token');
        lines.push(`    "${h.name}: ${val}",`);
      }
      lines.push(`];`);

      let hasBody = false;
      if (endpoint.requestBody && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
        hasBody = true;
        let mock = endpoint.requestBody.exampleData || {};
        if (liveBodyText) {
          try { mock = JSON.parse(liveBodyText); } catch (e) {}
        }
        lines.push(``);
        lines.push(`$payload = ` + toPhpArray(mock, 0) + `;`);
      }

      lines.push(``);
      lines.push(`$ch = curl_init();`);
      lines.push(`curl_setopt_array($ch, [`);
      lines.push(`    CURLOPT_URL => $url,`);
      lines.push(`    CURLOPT_RETURNTRANSFER => true,`);
      lines.push(`    CURLOPT_CUSTOMREQUEST => "${method}",`);
      lines.push(`    CURLOPT_HTTPHEADER => $headers,`);
      if (hasBody) {
        lines.push(`    CURLOPT_POSTFIELDS => json_encode($payload),`);
      }
      lines.push(`]);`);
      lines.push(``);
      lines.push(`$response = curl_exec($ch);`);
      lines.push(`$httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);`);
      lines.push(``);
      lines.push(`if (curl_errno($ch)) {`);
      lines.push(`    echo "cURL Error: " . curl_error($ch) . "\\n";`);
      lines.push(`} else {`);
      lines.push(`    echo "HTTP Status: {$httpCode}\\n";`);
      lines.push(`    echo $response . "\\n";`);
      lines.push(`}`);
      lines.push(``);
      lines.push(`curl_close($ch);`);

      return lines.join('\n');
    }

    /**
     * Golang (net/http) Code Generator
     */
    function generateGolangCode(endpoint, baseUrl, liveParamValues = {}, liveBodyText = null) {

      const hasBody = endpoint.requestBody && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method);

      lines.push(`func main() {`);

      if (queryParams.length > 0) {
        lines.push(`\tbaseURL, err := url.Parse("${cleanBase}${pathExpr}")`);
        lines.push(`\tif err != nil {`);
        lines.push(`\t\tlog.Fatalf("URL parse error: %v", err)`);

        }
        lines.push(`\tbaseURL.RawQuery = params.Encode()`);
        lines.push(`\tapiURL := baseURL.String()`);
      } else {
        lines.push(`\tapiURL := "${cleanBase}${pathExpr}"`);
      }

      if (hasBody) {
        let mock = endpoint.requestBody.exampleData || {};
        if (liveBodyText) {
          try { mock = JSON.parse(liveBodyText); } catch (e) {}
        }
        const jsonStr = JSON.stringify(mock, null, 2);

        lines.push(`\tpayload := []byte(\`${jsonStr}\`)`);
